name: ports

# 항구가 빈 선사의 페이지를 다시 읽어, 라벨이 붙어 답이 하나인 곳만 registry에 채웁니다.
#
# 항구는 사람이 적는 값이라(core/merge.js의 신원) 저절로 채워지지 않는데, 손으로 채우려면
# 선사 페이지를 하나씩 열어야 합니다. 개발 환경에서는 국내 도메인이 막혀 열 수조차 없습니다.
# 러너는 닿으므로 여기서 돕니다 — peek·discover와 같은 이유입니다.
#
# Actions 탭 → ports → Run workflow.
# 순서는 급한 곳부터입니다: 지금 현황판에 같은 배가 두 줄로 뜨는 곳(quality.js) → 출조가 많은 곳.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '다시 읽을 선사 수 (호스트당 3초 간격이라 40곳이면 2분쯤)'
        required: false
        type: string
        default: '40'
      open_pr:
        description: '라벨로 찾은 값을 registry에 채운 PR까지 열기'
        required: false
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write

jobs:
  ports:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # 홈페이지 본문만 읽습니다(mode: static). 브라우저는 필요 없습니다.
      - name: 항구 다시 읽기
        env:
          LIMIT: ${{ inputs.limit }}
          ADD: ${{ inputs.open_pr && '--add' || '' }}
        run: node discover.js ports --limit "$LIMIT" $ADD

      # 값으로 못 쓴 후보까지 전부 들어 있습니다. 사람이 고를 때 여기부터 봅니다.
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ports
          path: tmp/
          if-no-files-found: ignore
          retention-days: 7

      # 자동으로 머지하지 않습니다. 항구는 다른 사이트의 같은 배와 합칠지를 정하는 값이라
      # (core/merge.js) 잘못 채우면 다른 배가 한 줄로 붙습니다. 사람이 페이지와 맞춰봐야 합니다.
      - name: registry PR 열기
        if: inputs.open_pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git diff --quiet sites/registry.json && echo "채운 값이 없습니다" && exit 0
          branch="ports/${{ github.run_id }}"
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git checkout -b "$branch"
          git add sites/registry.json
          git commit -m "feat(sites): 페이지에서 읽은 출항지 채우기"
          git push -u origin "$branch"
          gh pr create \
            --title "feat(sites): 페이지에서 읽은 출항지 채우기" \
            --body "$(printf '%s\n' \
              'ports 워크플로가 항구 빈 선사의 페이지를 다시 읽어, **"출항지 : ○○항"처럼 라벨이 붙어 답이 하나인 곳**만 채웠습니다.' \
              '' \
              '- 후보가 여럿이거나 라벨이 없는 곳은 채우지 않았습니다. 그 후보들은 이 실행의 아티팩트(`ports`)에 `tmp/ports.json`으로 올라가 있습니다.' \
              '- 이미 값이 있는 곳은 건드리지 않습니다.' \
              '' \
              '**머지 전에 확인할 것**: 각 선사 페이지의 출항지. 이름·출항지·전화번호가 셋 다 맞아야 다른 사이트에 올라온 같은 배와 한 줄로 합쳐집니다(`core/merge.js`). 애매하면 비워두세요 — 합쳐서 틀리는 것보다 두 줄이 낫습니다.')" \
            || echo "PR은 못 열었습니다(Actions에 PR 생성 권한이 없을 수 있습니다). 브랜치는 올라가 있으니 여기서 여세요: ${{ github.server_url }}/${{ github.repository }}/compare/$branch?expand=1"
