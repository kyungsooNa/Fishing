name: times

# 출항시각이 빈 선사의 홈페이지 공지를 읽어, 시각처럼 보이는 줄만 로그에 찍습니다.
#
# 예약판에 시각이 아예 없는 사이트가 91곳(2,827건)입니다(node quality.js). 거기는 파서를
# 고쳐도 안 채워지고, 선사 공지에서 사람이 확인해 registry의 timeGuide에 적어야 합니다.
# 개발 환경에서는 국내 도메인이 막혀 공지를 열 수조차 없어서 여기서 돕니다 — peek·ports와
# 같은 이유입니다.
#
# **값을 채우지 않습니다.** timeGuide는 시각만이 아니라 어느 어종에 언제까지 유효한지까지
# 적어야 하는 값이라 공지 한 줄에서 기계가 정할 수 없습니다. 후보 줄을 그대로 보여주고
# 사람이 고릅니다. 그래서 이 워크플로에는 PR을 여는 단계가 없습니다.
#
# Actions 탭 → times → Run workflow.

on:
  workflow_dispatch:
    inputs:
      limit:
        description: '읽을 선사 수 (호스트당 3초 간격이라 30곳이면 2분쯤)'
        required: false
        type: string
        default: '30'

jobs:
  times:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # 홈페이지 본문만 읽습니다(mode: static). 브라우저는 필요 없습니다.
      - name: 공지에서 출항시각 후보 읽기
        env:
          LIMIT: ${{ inputs.limit }}
        run: node discover.js times --limit "$LIMIT"

      # 후보 줄은 로그에도 그대로 찍히지만, 파일에는 안 자른 값까지 들어 있습니다.
      - name: 결과 올리기
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: times
          path: tmp/
          if-no-files-found: ignore
          retention-days: 7
