name: research

on:
  workflow_dispatch:
    inputs:
      sites:
        description: '선사 id 쉼표 구분 (비우면 미확인 정보가 많은 순)'
        type: string
        default: ''
      limit:
        description: '선사 수 (1~50)'
        type: string
        default: '5'
      pages:
        description: '선사당 페이지 수 (1~20)'
        type: string
        default: '6'
      force:
        description: '이전 확인 이력과 무관하게 조사'
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: research
  cancel-in-progress: false

jobs:
  research:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --no-audit --no-fund
      - uses: actions/cache/restore@v4
        with:
          path: tmp/research/history.json
          key: research-${{ github.run_id }}
          restore-keys: research-
      - name: 공식 사이트 정보 조사
        env:
          SITES: ${{ inputs.sites }}
          LIMIT: ${{ inputs.limit }}
          PAGES: ${{ inputs.pages }}
          FORCE: ${{ inputs.force }}
        shell: bash
        run: |
          args=(--limit "$LIMIT" --pages "$PAGES")
          if [ -n "$SITES" ]; then args+=(--sites "$SITES"); fi
          if [ "$FORCE" = true ]; then args+=(--force); fi
          node research.js "${args[@]}"
      - uses: actions/cache/save@v4
        if: always()
        with:
          path: tmp/research/history.json
          key: research-${{ github.run_id }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: research
          path: tmp/research/
          if-no-files-found: ignore
          retention-days: 30
