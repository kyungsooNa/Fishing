name: sunsang

on:
  schedule:
    # 선상24는 IP당 요청 차단을 피하려고 새 러너에서 8곳씩 이어 봅니다.
    # 정각 혼잡을 피하려고 2분부터 시작합니다.
    - cron: '2-57/5 * * * *'
  workflow_dispatch:

concurrency:
  # 전체 수집과 데이터 커밋이 겹치지 않게 같은 그룹을 씁니다.
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: 브라우저가 필요한지 확인
        id: browser
        run: echo "needed=$(npm run -s needs-browser)" >> "$GITHUB_OUTPUT"

      - name: playwright chromium
        if: steps.browser.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium

      - name: 선상24 다음 8곳 수집
        run: node collect.js
        env:
          ONLY_ADAPTER: sunsang24
          DAYS: '21'
          HORIZON_DAYS: '90'
          TIMEOUT_BACKOFF_HOURS: '6'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data.json docs/future.json
          git diff --cached --quiet && echo "변한 게 없어 커밋하지 않습니다" && exit 0

          cp docs/data.json "$RUNNER_TEMP/data.json"
          cp docs/future.json "$RUNNER_TEMP/future.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/data.json" docs/data.json
            cp "$RUNNER_TEMP/future.json" docs/future.json
            git add docs/data.json docs/future.json
            if git diff --cached --quiet; then
              echo "그 사이 같은 내용이 올라왔습니다 — 커밋하지 않습니다"
              exit 0
            fi
            git commit -m "chore: 선상24 수집 $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then exit 0; fi
            echo "push가 거부됐습니다($attempt/3) — main을 다시 받아 얹습니다"
          done
          echo "세 번 시도했지만 push하지 못했습니다"
          exit 1
