name: collect

on:
  schedule:
    # 한국시간 06:10 / 12:10 / 18:10 / 21:10 (UTC 기준 -9시간)
    - cron: '10 21 * * *'
    - cron: '10 3 * * *'
    - cron: '10 9 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # 브라우저는 필요할 때만 받습니다. registry가 전부 static이 되면 이 단계는
      # 저절로 건너뛰어져서 1~2분 빨라집니다. "js"뿐 아니라 "auto"도 본문이 비면
      # 브라우저로 넘어가므로 같이 셉니다.
      - name: 브라우저가 필요한지 확인
        id: browser
        run: echo "needed=$(npm run -s needs-browser)" >> "$GITHUB_OUTPUT"

      - name: playwright chromium
        if: steps.browser.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium

      - run: node collect.js
        env:
          DAYS: '21'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      - name: commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/data.json
          git diff --cached --quiet && echo "변한 게 없어 커밋하지 않습니다" && exit 0
          git commit -m "chore: 수집 $(date -u +'%Y-%m-%d %H:%M') UTC"
          git push
