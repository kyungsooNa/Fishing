name: collect

on:
  schedule:
    # 한국시간 06:10 / 12:10 / 18:10 / 21:10 (UTC 기준 -9시간)
    - cron: '10 21 * * *'
    - cron: '10 3 * * *'
    - cron: '10 9 * * *'
    - cron: '10 12 * * *'
  workflow_dispatch:

concurrency:
  group: collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      # 브라우저는 필요할 때만 받습니다. registry가 전부 static이 되면 이 단계는
      # 저절로 건너뛰어져서 1~2분 빨라집니다. "js"뿐 아니라 "auto"도 본문이 비면
      # 브라우저로 넘어가므로 같이 셉니다.
      - name: 브라우저가 필요한지 확인
        id: browser
        run: echo "needed=$(npm run -s needs-browser)" >> "$GITHUB_OUTPUT"

      - name: playwright chromium
        if: steps.browser.outputs.needed == 'true'
        run: npx playwright install --with-deps chromium

      - run: node collect.js
        env:
          DAYS: '21'
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          DISCORD_WEBHOOK: ${{ secrets.DISCORD_WEBHOOK }}

      # 수집이 15~20분 걸립니다. 그 사이 main에 다른 커밋이 들어오면 push가 거부되고,
      # 방금 받아온 결과가 통째로 버려집니다(실제로 한 번 그랬습니다). 거부되면 최신
      # main 위에 결과만 다시 얹습니다 — data.json은 수집할 때마다 통째로 다시 쓰는
      # 파일이라 남의 변경과 섞을 게 없습니다.
      - name: commit data.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add docs/data.json
          git diff --cached --quiet && echo "변한 게 없어 커밋하지 않습니다" && exit 0

          cp docs/data.json "$RUNNER_TEMP/data.json"
          for attempt in 1 2 3; do
            git fetch origin main
            git reset --hard origin/main
            cp "$RUNNER_TEMP/data.json" docs/data.json
            git add docs/data.json
            if git diff --cached --quiet; then
              echo "그 사이 같은 내용이 올라왔습니다 — 커밋하지 않습니다"
              exit 0
            fi
            git commit -m "chore: 수집 $(date -u +'%Y-%m-%d %H:%M') UTC"
            if git push; then exit 0; fi
            echo "push가 거부됐습니다($attempt/3) — main을 다시 받아 얹습니다"
          done
          echo "세 번 시도했지만 push하지 못했습니다"
          exit 1
