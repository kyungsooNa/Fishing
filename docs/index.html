<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낚시 출조 예약 현황판</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --card: #fff; --fg: #1c1b19; --muted: #6b6862; --line: #e3e1dc;
    --open: #1a7f4b; --few: #b06a00; --closed: #8b8781; --off: #a03030;
    --accent: #245a8d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --card: #201f23; --fg: #e9e7e2; --muted: #9a968e; --line: #33323a;
      --open: #4cc487; --few: #e0a33c; --closed: #7d7a74; --off: #e07070; --accent: #7fb0e0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  select, input[type=search] { padding: 7px 10px; border: 1px solid var(--line); border-radius: 7px;
                               background: var(--card); color: var(--fg); font: inherit; font-size: 14px; }
  label.check { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px;
                border: 1px solid var(--line); border-radius: 7px; background: var(--card); font-size: 14px; }
  .tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 820px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  tbody tr:last-child td { border-bottom: 0; }
  tr.daystart td { border-top: 2px solid var(--line); }
  .badge { font-weight: 600; }
  .open { color: var(--open); } .few { color: var(--few); }
  .closed { color: var(--closed); } .off { color: var(--off); } .unknown { color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .views { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
  .views a { margin-left: auto; font-size: 13px; }
  .views button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 7px;
                  background: var(--card); color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
  .views button.on { color: var(--fg); font-weight: 600; border-color: var(--muted); }
  #map { height: 62vh; min-height: 340px; border: 1px solid var(--line); border-radius: 10px; }
  .leaflet-container { background: var(--card); font: inherit; }
  .maphint { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .star { border: 0; background: none; cursor: pointer; font-size: 15px; line-height: 1;
          padding: 0 2px; color: var(--line); }
  .star.on { color: var(--few); }
  .star:hover { color: var(--few); }
  td.starcell, th.starcell { width: 1%; padding-right: 4px; }
  details { margin-top: 22px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  .status { margin-top: 10px; display: grid; gap: 5px; }
  .status div { display: flex; gap: 8px; }
  .fail { color: var(--off); }
</style>
</head>
<body>
<div class="wrap">
  <h1>낚시 출조 예약 현황판</h1>
  <div class="sub" id="meta">불러오는 중…</div>

  <div class="filters">
    <select id="f-site"><option value="">전체 선사</option></select>
    <select id="f-port"><option value="">전체 항구</option></select>
    <select id="f-species"><option value="">전체 어종</option></select>
    <select id="f-session"><option value="">오전·오후·종일</option></select>
    <select id="f-date"><option value="">전체 날짜</option></select>
    <input type="search" id="f-q" placeholder="배 이름 검색">
    <label class="check"><input type="checkbox" id="f-open" checked> 빈자리만</label>
    <label class="check"><input type="checkbox" id="f-fav"> <span id="f-fav-label">★ 즐겨찾기만</span></label>
  </div>

  <div class="views">
    <button id="view-table" class="on">표</button>
    <button id="view-map">지도</button>
    <a href="admin.html">시스템 관리 →</a>
  </div>

  <div id="map" hidden></div>
  <div class="maphint" id="maphint" hidden></div>

  <div class="tablewrap" id="tablewrap">
    <table>
      <thead><tr>
        <th class="starcell"></th><th>날짜</th><th>운항</th><th>구분</th><th>선사</th><th>배</th><th>항구</th>
        <th>어종</th><th>물때</th><th>상태</th><th class="num">잔여</th><th class="num">승선료</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>조건에 맞는 출조가 없습니다.</div>
  </div>

  <details>
    <summary>수집 상태</summary>
    <div class="status" id="status"></div>
  </details>
</div>

<script>
const LABEL = { open: '예약가능', few: '잔여 적음', closed: '마감', off: '휴항', unknown: '확인필요' };
const WEEK = ['일','월','화','수','목','금','토'];
let DATA = { trips: [], sites: {}, ports: {}, generatedAt: null };

// ── 즐겨찾기 ──────────────────────────────────────────────────────────────
// 브라우저에만 저장합니다. 서버가 없으니 기기마다 따로 남습니다.
// 배 이름만으로는 안 됩니다 — 다른 지역에 같은 이름의 배가 있어서, 출항지까지 묶습니다.
const FAV_KEY = 'fishing:favorites';
const favKey = (t) => `${t.boat ?? ''}|${t.port ?? ''}`;

function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) ?? '[]')); } catch { return new Set(); }
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...FAVS])); } catch { /* 저장이 막혀도 이번 세션은 됩니다 */ }
}
function toggleFav(t) {
  const k = favKey(t);
  if (!FAVS.delete(k)) FAVS.add(k);
  saveFavs();
  refresh();
}
let FAVS = loadFavs();

const $ = (id) => document.getElementById(id);
const won = (n) => n == null ? '' : n.toLocaleString('ko-KR') + '원';

// 04:00 출항해서 17:00 들어오면 "04:00~17:00". 끝 시각을 모르면 시작만.
const runLabel = (t) => (t.departAt ? (t.returnAt ? `${t.departAt}~${t.returnAt}` : t.departAt) : '');

// "종일 13시간" — 몇 시간짜리인지가 오전배냐 종일배냐만큼 중요합니다.
function sessionLabel(t) {
  if (!t.session) return '';
  const h = t.hours == null ? '' : ` ${String(t.hours).replace(/\.0$/, '')}시간`;
  return t.session + h;
}

function dayLabel(d) {
  const [y, m, dd] = d.split('-').map(Number);
  return `${m}/${dd}(${WEEK[new Date(y, m - 1, dd).getDay()]})`;
}

function fillOptions(sel, values) {
  for (const v of [...new Set(values.filter(Boolean))].sort()) {
    sel.append(new Option(sel.id === 'f-date' ? dayLabel(v) : v, v));
  }
}

// 표와 지도가 같은 기준을 보도록 필터는 한 군데서만 겁니다.
function visibleTrips() {
  const site = $('f-site').value, port = $('f-port').value, species = $('f-species').value;
  const date = $('f-date').value, q = $('f-q').value.trim(), openOnly = $('f-open').checked;
  const favOnly = $('f-fav').checked, session = $('f-session').value;

  return DATA.trips.filter((t) =>
    (!favOnly || FAVS.has(favKey(t))) &&
    (!site || t.siteName === site || (t.sources ?? []).some((x) => x.siteName === site)) && (!port || t.port === port) &&
    (!species || t.species === species) && (!date || t.date === date) &&
    (!session || t.session === session) &&
    (!q || (t.boat ?? '').includes(q)) &&
    (!openOnly || t.status === 'open' || t.status === 'few'));
}

function render() {
  const rows = visibleTrips();

  const tbody = $('rows');
  tbody.textContent = '';
  let prevDate = null;

  for (const t of rows) {
    const tr = document.createElement('tr');
    if (t.date !== prevDate) { tr.className = 'daystart'; prevDate = t.date; }
    const starCell = document.createElement('td');
    starCell.className = 'starcell';
    const star = document.createElement('button');
    const on = FAVS.has(favKey(t));
    star.className = 'star' + (on ? ' on' : '');
    star.textContent = on ? '★' : '☆';
    star.title = on ? '즐겨찾기에서 빼기' : '즐겨찾기에 넣기';
    star.setAttribute('aria-label', star.title);
    star.addEventListener('click', () => toggleFav(t));
    starCell.append(star);
    tr.append(starCell);

    const cells = [
      dayLabel(t.date), runLabel(t), sessionLabel(t), t.siteName ?? '', t.boat ?? '', t.port ?? '',
      t.species ?? '', t.tide ?? '', null,
      Number.isFinite(t.seatsLeft) ? String(t.seatsLeft) : '', won(t.price),
    ];
    cells.forEach((v, i) => {
      const td = document.createElement('td');
      if (i === 8) {
        const b = document.createElement('span');
        b.className = 'badge ' + t.status;
        b.textContent = LABEL[t.status] ?? t.status;
        td.append(b);
      } else if (i === 3) {
        // 여러 사이트에 같은 배가 올라와 있으면 둘 다 걸어줍니다. 어디서 잡든 상관없으니까요.
        const sources = t.sources?.length ? t.sources : [{ siteName: t.siteName, url: t.url }];
        sources.forEach((src, n) => {
          if (n) td.append(' · ');
          if (!src.url) { td.append(src.siteName ?? ''); return; }
          const a = document.createElement('a');
          a.href = src.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
          a.textContent = src.siteName ?? '';
          if (Number.isFinite(src.seatsLeft)) a.title = `이 사이트 기준 잔여 ${src.seatsLeft}`;
          td.append(a);
        });
      } else {
        td.textContent = v;
      }
      if (i >= 9) td.className = 'num';
      tr.append(td);
    });
    tbody.append(tr);
  }

  $('empty').hidden = rows.length > 0;
  $('f-fav-label').textContent = FAVS.size ? `★ 즐겨찾기만 (${FAVS.size})` : '★ 즐겨찾기만';
}

function renderStatus() {
  const box = $('status');
  box.textContent = '';
  for (const [id, s] of Object.entries(DATA.sites)) {
    const div = document.createElement('div');
    if (!s.ok) div.className = 'fail';
    const when = s.at ? new Date(s.at).toLocaleString('ko-KR') : '';
    const kind = s.platform ? ` [${s.platform}]` : '';
    div.textContent = s.ok
      ? `✓ ${s.name ?? id}${kind} — ${s.count}건 · ${when}`
      : `✗ ${s.name ?? id}${kind} — 갱신 실패(${s.error}) · 직전 ${s.count}건 유지`;
    box.append(div);
  }
}

fetch('data.json?t=' + Date.now())
  .then((r) => r.json())
  .then((d) => {
    DATA = d;
    const failed = Object.values(d.sites).filter((s) => !s.ok).length;
    $('meta').textContent =
      `출조 ${d.trips.length}건 · 갱신 ${d.generatedAt ? new Date(d.generatedAt).toLocaleString('ko-KR') : '-'}` +
      (failed ? ` · 갱신 실패 ${failed}곳` : '');
    fillOptions($('f-site'), d.trips.map((t) => t.siteName));
    fillOptions($('f-port'), d.trips.map((t) => t.port));
    fillOptions($('f-species'), d.trips.map((t) => t.species));
    fillOptions($('f-session'), d.trips.map((t) => t.session));
    fillOptions($('f-date'), d.trips.map((t) => t.date));
    renderStatus();
    render();
  })
  .catch((e) => { $('meta').textContent = 'data.json을 못 읽었습니다: ' + e.message; });

const refresh = () => { render(); drawMap(); };
for (const id of ['f-site', 'f-port', 'f-species', 'f-session', 'f-date', 'f-open', 'f-fav']) $(id).addEventListener('change', refresh);
$('f-q').addEventListener('input', refresh);

// ── 지도 ──────────────────────────────────────────────────────────────────
// 항구 좌표는 data.json의 ports로 들어옵니다(sites/ports.json에서 옵니다).
// 마커는 "지금 필터에 걸린" 출조 기준이라, 어종·날짜를 좁히면 지도도 같이 좁혀집니다.
let map = null;
let markers = null;

const css = (name) => getComputedStyle(document.body).getPropertyValue(name).trim() || '#888';

function ensureMap() {
  if (map || !window.L) return;
  map = L.map('map', { scrollWheelZoom: false }).setView([36.9, 126.6], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  markers = L.layerGroup().addTo(map);
}

function drawMap() {
  if (!map || !markers) return;
  markers.clearLayers();

  const byPort = new Map();
  for (const t of visibleTrips()) {
    if (!t.port || !DATA.ports?.[t.port]) continue;
    const cur = byPort.get(t.port) ?? { trips: 0, open: 0 };
    cur.trips += 1;
    if (t.status === 'open' || t.status === 'few') cur.open += 1;
    byPort.set(t.port, cur);
  }

  const bounds = [];
  for (const [port, count] of byPort) {
    const { lat, lng, approx } = DATA.ports[port];
    const color = count.open ? css('--open') : css('--closed');
    bounds.push([lat, lng]);
    L.circleMarker([lat, lng], {
      radius: Math.min(9 + count.open * 1.6, 26),
      color, fillColor: color, fillOpacity: 0.35, weight: 2,
    })
      .bindTooltip(`${port}${approx ? ' (대략 위치)' : ''}<br>출조 ${count.trips}건 · 빈자리 ${count.open}건`)
      .on('click', () => { $('f-port').value = port; refresh(); })
      .addTo(markers);
  }

  $('maphint').textContent = Object.keys(DATA.ports ?? {}).length
    ? `항구 ${byPort.size}곳 · 마커를 누르면 그 항구만 봅니다. 좌표는 대략값이라 실제 선착장과 다를 수 있습니다.`
    : '항구 좌표가 없습니다 — sites/ports.json을 채우세요.';
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
}

function switchView(toMap) {
  $('view-map').classList.toggle('on', toMap);
  $('view-table').classList.toggle('on', !toMap);
  $('map').hidden = !toMap;
  $('maphint').hidden = !toMap;
  $('tablewrap').hidden = toMap;
  if (!toMap) return;
  ensureMap();
  // 숨겨진 채로 만들어진 지도는 자기 크기를 모릅니다.
  setTimeout(() => { map?.invalidateSize(); drawMap(); }, 0);
}

$('view-map').addEventListener('click', () => switchView(true));
$('view-table').addEventListener('click', () => switchView(false));
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
</body>
</html>
