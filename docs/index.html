<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>낚시 출조 메타검색 · 취소석 레이더</title>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.css">
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --card: #fff; --fg: #1c1b19; --muted: #6b6862; --line: #e3e1dc;
    --open: #1a7f4b; --few: #b06a00; --closed: #8b8781; --off: #a03030;
    --accent: #087fb5; --accent-soft: #e8f6fc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --card: #201f23; --fg: #e9e7e2; --muted: #9a968e; --line: #33323a;
      --open: #4cc487; --few: #e0a33c; --closed: #7d7a74; --off: #e07070;
      --accent: #73c7ef; --accent-soft: #183544;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 16px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  .filters { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 14px; }
  /* 배를 이름으로 찾는 것이 이 화면에서 제일 자주 하는 일인데, 필터 여덟 개 뒤에 같은
     모양으로 끼워 두니 있는 줄도 몰랐습니다. 줄을 따로 내주고 크기·아이콘으로 구분합니다. */
  .searchbar { position: relative; display: flex; margin-bottom: 9px; }
  .searchicon { position: absolute; top: 50%; left: 13px; width: 17px; height: 17px;
                transform: translateY(-50%); fill: none; stroke: var(--muted); stroke-width: 1.7;
                stroke-linecap: round; pointer-events: none; }
  input[type=search] { flex: 0 1 400px; min-width: 0; padding: 10px 12px 10px 38px;
                       border: 1px solid var(--line); border-radius: 10px;
                       background: var(--card); color: var(--fg); font: inherit; font-size: 15px; }
  input[type=search]:focus { border-color: var(--accent); outline: none;
                             box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 22%, transparent); }
  /* 검색어가 들어 있으면 표가 걸러진 상태입니다 — 필터가 켜졌을 때와 같은 색으로 알립니다. */
  input[type=search]:not(:placeholder-shown) { border-color: var(--accent); background: var(--accent-soft); }
  input[type=search]:not(:placeholder-shown) + .searchicon,
  .searchbar:focus-within .searchicon { stroke: var(--accent); }
  .multi { position: relative; margin: 0; color: var(--fg); font-size: 14px; }
  .multi summary { min-width: 118px; padding: 7px 28px 7px 10px; border: 1px solid var(--line);
                   border-radius: 7px; background: var(--card); cursor: pointer; list-style: none; }
  .multi summary::-webkit-details-marker { display: none; }
  .multi summary::after { content: '▾'; position: absolute; top: 50%; right: 10px;
                           transform: translateY(-50%); color: var(--muted); }
  .multi[open] summary { border-color: var(--muted); }
  .multi[data-selected="1"] summary { border-color: color-mix(in srgb, var(--accent) 55%, var(--line));
                                      background: var(--accent-soft); color: var(--accent); font-weight: 700; }
  .multi-menu { position: absolute; z-index: 1000; top: calc(100% + 4px); left: 0; min-width: 220px;
                max-height: 300px; overflow: auto; padding: 6px; border: 1px solid var(--line);
                border-radius: 7px; background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,.14); }
  select#f-sort { border: 1px solid var(--line); border-radius: 8px; background: var(--card); color: var(--fg);
                  padding: 7px 9px; font-size: 14px; font-family: inherit; }
  .multi-menu label { display: flex; align-items: center; gap: 7px; padding: 5px 6px; white-space: nowrap; }
  .multi-menu label:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); }
  .date-menu { width: 252px; min-width: 252px; max-height: none; overflow: visible; padding: 10px; }
  .date-head { display: grid; grid-template-columns: 32px 1fr 32px; align-items: center; gap: 4px; }
  .date-head strong { text-align: center; font-size: 14px; }
  .date-menu button { border: 1px solid var(--line); border-radius: 7px; background: var(--card);
                      color: var(--muted); font: inherit; cursor: pointer; }
  .date-menu button:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  .date-menu button:focus-visible { outline: 2px solid var(--accent); outline-offset: 1px; }
  .date-nav { width: 32px; height: 32px; padding: 0; font-size: 17px; }
  .date-nav:disabled { opacity: .3; cursor: default; }
  .date-week, .date-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 2px; }
  .date-week { margin-top: 7px; color: var(--muted); font-size: 11px; text-align: center; }
  .date-week span { padding: 3px 0; }
  .date-grid button, .date-blank { width: 31px; height: 31px; padding: 0; border: 0; border-radius: 6px; }
  .date-grid button { color: var(--fg); }
  .date-grid button:hover { background: var(--accent-soft); }
  .date-grid button.in-range { border-radius: 0; background: var(--accent-soft); color: var(--accent); }
  .date-grid button.range-start, .date-grid button.range-end {
    border-radius: 6px; background: var(--accent); color: var(--card); font-weight: 800;
  }
  .date-help { min-height: 18px; margin: 7px 2px 0; color: var(--muted); font-size: 12px; }
  .date-clear { width: 100%; margin-top: 6px; padding: 6px 10px; }
  label.check { display: inline-flex; align-items: center; gap: 6px; padding: 7px 10px;
                border: 1px solid var(--line); border-radius: 7px; background: var(--card); font-size: 14px; }
  .tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 820px; font-size: 14px; }
  th, td { padding: 9px 10px; text-align: left; border-bottom: 1px solid var(--line); }
  /* 칸마다 nowrap을 걸면 표의 자연 폭이 화면을 넘어 오른쪽 칸이 잘립니다.
     줄이 갈려도 되는 건 선사·배·항구·어종뿐이라, 나머지에만 nowrap을 둡니다. */
  th, td.nowrap, td.num, td.starcell, td.watchcell { white-space: nowrap; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; position: sticky; top: 0; background: var(--card); }
  tbody tr:last-child td { border-bottom: 0; }
  tr.daystart td { border-top: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line)); }
  tr.dayhead td {
    padding: 11px 12px;
    border-top: 3px solid var(--accent);
    border-bottom: 1px solid color-mix(in srgb, var(--accent) 35%, var(--line));
    background: color-mix(in srgb, var(--accent) 9%, var(--card));
    font-weight: 700;
    font-size: 15px;
  }
  .dayhead small { margin-left: 8px; color: var(--muted); font-size: 12px; font-weight: 600; }
  .daytoggle { float: right; width: 32px; height: 32px; margin: -5px -5px -5px 10px; padding: 0;
               border: 1px solid color-mix(in srgb, var(--accent) 30%, var(--line)); border-radius: 7px;
               background: var(--card); color: var(--accent); font: inherit; font-size: 16px;
               line-height: 1; cursor: pointer; }
  .daytoggle:hover { background: var(--accent-soft); }
  .daytoggle:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  tr.triprow[hidden] { display: none !important; }
  .tidegood { display: inline-block; margin-left: 8px; padding: 2px 7px; border-radius: 999px;
              background: color-mix(in srgb, var(--open) 14%, var(--card)); color: var(--open);
              border: 1px solid color-mix(in srgb, var(--open) 40%, transparent); font-size: 12px; font-weight: 800; }
  .badge { font-weight: 600; }
  .open { color: var(--open); } .few { color: var(--few); }
  .closed { color: var(--closed); } .off { color: var(--off); } .unknown { color: var(--muted); }
  .num { text-align: right; font-variant-numeric: tabular-nums; }
  a { color: var(--accent); }
  .empty { padding: 30px; text-align: center; color: var(--muted); }
  .views { display: flex; gap: 6px; margin-bottom: 10px; align-items: center; }
  .views button { padding: 6px 14px; border: 1px solid var(--line); border-radius: 7px;
                  background: var(--card); color: var(--muted); font: inherit; font-size: 14px; cursor: pointer; }
  .views button.on { color: var(--fg); font-weight: 600; border-color: var(--muted); }
  #map { height: 62vh; min-height: 340px; border: 1px solid var(--line); border-radius: 10px; }
  .leaflet-container { background: var(--card); font: inherit; }
  .maphint { margin-top: 8px; font-size: 12px; color: var(--muted); }
  .pager { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; margin: 10px 0; font-size: 13px; }
  .pager button { padding: 6px 12px; border: 1px solid var(--line); border-radius: 7px;
                  background: var(--card); color: var(--fg); font: inherit; font-size: 13px; cursor: pointer; }
  .pager button.on { border-color: var(--accent); color: var(--accent); font-weight: 700; }
  .pager button:disabled { color: var(--muted); cursor: not-allowed; }
  .pager .count { margin-left: auto; color: var(--muted); }
  /* 표에서 바로 매깁니다. 안 매긴 배는 ☆ 하나만 흐리게 둡니다 — 모든 줄에 ☆☆☆☆☆가
     깔리면 표가 안 읽힙니다. 고르는 칸(.ratepop)은 화면에 하나만 만들어 옮겨 씁니다. */
  /* 안 매긴 별을 테두리색(--line)으로 뒀더니 흰 배경에서 **안 보였습니다** — 매길 수 있다는
     것 자체를 모릅니다. 누를 수 있는 것은 눈에 보여야 합니다. 그렇다고 매긴 별과 같은
     색이면 안 매긴 배가 매긴 것처럼 보이므로, 회색으로 또렷하게 두고 매긴 별만 색을 줍니다. */
  .ratebtn { margin-left: 5px; padding: 0 2px; border: 0; background: none; color: var(--muted);
             font: inherit; font-size: 14px; letter-spacing: -1px; line-height: 1;
             white-space: nowrap; cursor: pointer; }
  .ratebtn.on { color: var(--few); }
  .ratebtn:hover { color: var(--few); }
  .ratebtn:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; border-radius: 4px; }
  .ratepop { position: absolute; z-index: 2100; display: flex; align-items: center; gap: 1px;
             padding: 6px 9px; border: 1px solid var(--line); border-radius: 11px;
             background: var(--card); box-shadow: 0 8px 24px rgba(0,0,0,.18); }
  .ratepop[hidden] { display: none; }
  .ratepop button { padding: 0 1px; border: 0; background: none; color: var(--line);
                    font: inherit; font-size: 20px; line-height: 1; cursor: pointer; }
  .ratepop button.on, .ratepop button:hover { color: var(--few); }
  .ratepop .clear { margin-left: 7px; font-size: 12px; color: var(--muted); }
  .ratepop .clear:hover { color: var(--off); }
  .star { border: 0; background: none; cursor: pointer; font-size: 15px; line-height: 1;
          padding: 0 2px; color: var(--muted); }
  .star.on { color: var(--few); }
  .star:hover { color: var(--few); }
  td.starcell, th.starcell { width: 1%; padding-right: 4px; }
  .boatmark { display: none; }
  details { margin-top: 22px; font-size: 13px; color: var(--muted); }
  summary { cursor: pointer; }
  .status { margin-top: 10px; display: grid; gap: 5px; }
  .status div { display: flex; gap: 8px; }
  .fail { color: var(--off); }
  .held { color: var(--few); }
  .watchactions { display: flex; align-items: center; justify-content: flex-end; gap: 5px; }
  .watch { border: 1px solid var(--line); border-radius: 6px; background: var(--card); color: var(--accent); padding: 5px 8px; cursor: pointer; }
  .watch.refresh { color: var(--fg); }
  .watch:disabled { color: var(--muted); cursor: wait; }
  .source-select { min-width: 92px; max-width: 145px; padding: 4px 5px; border: 1px solid var(--line);
                   border-radius: 6px; background: var(--card); color: var(--fg); font: inherit; font-size: 12px; }
  .srcchip { display: inline-block; margin-left: 5px; padding: 1px 6px; border: 1px solid var(--line);
             border-radius: 999px; font-size: 11px; color: var(--muted); vertical-align: middle; }
  .srcseats { margin-left: 4px; font-size: 11px; color: var(--few); }
  .srchint { margin-left: 4px; font-size: 11px; color: var(--muted); }
  /* 자리가 났을 때 사람이 하는 일은 결국 전화입니다. 선사 칸 밑에 한 줄로 답니다 —
     칸을 새로 만들면 표의 자연 폭이 그만큼 늘어 오른쪽 칸이 잘립니다. */
  .phone { display: block; margin-top: 2px; font-size: 12px; color: var(--muted);
           white-space: nowrap; text-decoration: none; font-variant-numeric: tabular-nums; }
  .phone:hover { color: var(--accent); text-decoration: underline; }
  .freshness { display: block; font-size: 11px; font-weight: normal; color: var(--muted); }
  .freshness.stale { color: var(--few); }
  .freshness.failed { color: var(--off); }

  /* 선상24 모바일 목록의 장점인 "작은 카드 안에 필요한 값이 모두 보이는 밀도"만 가져옵니다.
     사진 데이터는 없으므로 남의 이미지를 복제하지 않고 배 이름 첫 글자를 식별 타일로 씁니다. */
  @media (max-width: 720px) {
    body { background: var(--card); }
    .wrap { padding: 0 0 40px; }
    h1 { position: sticky; z-index: 1100; top: 0; margin: 0; padding: 14px 14px 12px;
         border-bottom: 1px solid var(--line); background: color-mix(in srgb, var(--card) 94%, transparent);
         backdrop-filter: blur(12px); font-size: 18px; }
    .sub { margin: 0; padding: 7px 14px; font-size: 12px; }
    #meta { padding-top: 10px; color: var(--fg); }
    #monitor-status { padding-top: 0; padding-bottom: 10px; }
    #watch-panel { margin: 0 14px 10px; }

    /* 검색칸과 필터는 한 덩어리로 붙여 둡니다. 따로 두면 검색칸만 스크롤에 밀려 사라집니다.
       아래 sticky 값들이 이 덩어리 높이에 얹혀 있습니다 — 여기를 고치면 .multi-menu와
       tr.dayhead의 top도 같이 재서 고치세요(제목 55px + 이 덩어리 높이). */
    .controls { position: sticky; z-index: 1050; top: 55px;
                border-block: 1px solid var(--line); background: var(--card); }
    .searchbar { margin: 0; padding: 9px 12px 0; }
    .searchicon { left: 25px; }
    .filters { flex-wrap: nowrap; gap: 7px;
               margin: 0; padding: 9px 12px 10px; overflow-x: auto; overscroll-behavior-x: contain;
               background: var(--card); scrollbar-width: none; }
    .filters::-webkit-scrollbar { display: none; }
    .multi { flex: 0 0 auto; }
    .multi summary, label.check { min-width: auto; border-radius: 999px; white-space: nowrap; }
    .multi summary { padding: 6px 27px 6px 11px; }
    .multi-menu { position: fixed; z-index: 2000; top: 161px; right: 12px; left: 12px;
                  max-height: min(55vh, 380px); border-radius: 14px; }
    input[type=search] { flex: 1 1 auto; border-radius: 999px; padding: 8px 14px 8px 36px; }
    label.check { flex: 0 0 auto; padding: 6px 10px; }

    .views { margin: 10px 12px 8px; }
    .views button { border-radius: 999px; padding: 6px 13px; }
    #map { height: 70vh; min-height: 420px; margin: 0 10px; border-radius: 14px; }
    .maphint { margin: 8px 12px; }
    .pager { flex-wrap: nowrap; margin: 8px 12px; overflow-x: auto; scrollbar-width: none; }
    .pager::-webkit-scrollbar { display: none; }
    .pager button { flex: 0 0 auto; border-radius: 999px; }
    .pager .count { flex: 0 0 auto; margin-left: 4px; }

    .tablewrap { overflow: visible; border: 0; border-radius: 0; background: var(--bg); }
    table, tbody { display: block; width: 100%; min-width: 0; }
    thead { display: none; }
    tbody { padding: 0 9px 12px; }
    tbody tr.triprow { display: grid; grid-template-columns: 72px minmax(0, 1fr) auto;
                       grid-template-areas:
                         "thumb boat state"
                         "thumb site seats"
                         "thumb species seats"
                         "thumb run price"
                         "thumb port watch";
                       column-gap: 11px; row-gap: 2px; margin: 0 0 8px; padding: 11px;
                       border: 1px solid var(--line); border-radius: 13px; background: var(--card);
                       box-shadow: 0 2px 8px rgba(18, 61, 83, .06); }
    tbody tr.triprow td { display: block; min-width: 0; padding: 0; border: 0; font-size: 13px; }
    tr.dayhead { display: block; position: sticky; z-index: 1000; top: 161px; }
    tr.dayhead td { display: block; margin: 0 -9px 8px; padding: 9px 13px; border-top-width: 2px;
                    font-size: 14px; box-shadow: 0 2px 5px rgba(18, 61, 83, .05); }
    .dayhead small { display: none; }
    .daytoggle { margin-top: -4px; margin-right: -5px; }
    .tidegood { font-size: 12px; }

    td.starcell { grid-area: thumb; position: relative; width: 72px; height: 72px; padding: 0; }
    .boatmark { display: flex; align-items: center; justify-content: center; width: 72px; height: 72px;
                border-radius: 10px; background: linear-gradient(145deg, var(--accent-soft),
                color-mix(in srgb, var(--accent) 24%, var(--card))); color: var(--accent);
                font-size: 28px; font-weight: 800; }
    .star { position: absolute; top: 4px; right: 4px; display: grid; place-items: center; width: 25px; height: 25px;
            padding: 0; border-radius: 50%; background: color-mix(in srgb, var(--card) 88%, transparent);
            box-shadow: 0 1px 4px rgba(0,0,0,.14); font-size: 16px; }
    .cell-date, .cell-session { display: none !important; }
    /* 배 이름 뒤에 별점이 붙습니다. 이름만 잘리고 별은 남아야 해서, 자르는 것은
       이름 쪽에 걸고 별은 줄지 않게 둡니다(한 칸을 통째로 자르면 별이 먼저 사라집니다). */
    .cell-boat { grid-area: boat; display: flex; align-items: baseline; gap: 4px; overflow: hidden;
                 color: var(--fg); font-size: 15px !important; font-weight: 800; }
    .cell-boat .boatname { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
    .cell-boat .ratebtn { flex: 0 0 auto; font-weight: 600; }
    /* 선사 이름 뒤에 출처·전화가 붙습니다. 한 줄로 자르면 뒤쪽이 통째로 사라지므로
       작은 화면에서는 이 칸만 여러 줄을 허용합니다. */
    .cell-site { grid-area: site; overflow: visible; color: var(--accent); white-space: normal; }
    /* 전화는 작은 화면에서 가장 쓸모 있는 값입니다(눌러서 바로 겁니다). */
    .cell-site .phone { color: var(--muted); font-size: 12px; }
    .cell-species { grid-area: species; overflow: hidden; color: var(--fg); text-overflow: ellipsis; white-space: nowrap; }
    .cell-run { grid-area: run; color: var(--muted); }
    .cell-run::before { content: '운항 '; }
    .cell-port { grid-area: port; overflow: hidden; color: var(--muted); text-overflow: ellipsis; white-space: nowrap; }
    .cell-port::before { content: '항구 '; }
    .cell-status { grid-area: state; align-self: start; padding-left: 8px !important; text-align: right; }
    .cell-seats { grid-area: seats; align-self: center; padding-left: 8px !important; color: var(--accent);
                  font-size: 14px !important; font-weight: 800; text-align: right; }
    .cell-price { grid-area: price; color: var(--muted); text-align: right; }
    .watchcell { grid-area: watch; align-self: end; text-align: right; }
    .watchactions { flex-wrap: wrap; }
    .watch { border-radius: 999px; padding: 4px 9px; font-size: 12px; }
    .freshness { font-size: 11px; font-weight: 500; }
    body > .leaflet-control-container { font-size: 13px; }
    .wrap > details:last-child { margin-inline: 14px; }
  }

  /* 왼쪽 탭바. 현황판과 시스템 관리는 파일이 둘이라 탭은 링크이고, 지금 보는 쪽에
     aria-current를 답니다. 색은 각 화면의 --accent를 그대로 쓰므로 현황판에서는 파랗고
     관리 화면에서는 주황입니다 — 어느 쪽에 있는지가 탭 말고도 한 번 더 보입니다.
     이 조각은 두 화면에 똑같이 들어갑니다. 한쪽만 고치면 탭이 화면마다 다른 자리에
     뜨므로 test/page.test.js가 둘을 맞춰 봅니다. */
  body { --nav-w: 172px; padding-left: var(--nav-w); }
  .sidenav { position: fixed; z-index: 1200; top: 0; bottom: 0; left: 0; width: var(--nav-w);
             display: flex; flex-direction: column; gap: 4px; padding: 16px 12px;
             border-right: 1px solid var(--line); background: var(--card); }
  .sidehead { display: flex; align-items: center; gap: 4px; padding: 6px 2px 14px 10px; }
  .sidebrand { flex: 1 1 auto; color: var(--muted); font-size: 12px; font-weight: 700;
               letter-spacing: .06em; }
  .navfold { flex: 0 0 auto; display: grid; place-items: center; width: 28px; height: 28px; padding: 0;
             border: 1px solid var(--line); border-radius: 8px; background: var(--card);
             color: var(--muted); cursor: pointer; }
  .navfold:hover { border-color: var(--accent); color: var(--accent); }
  .navfold:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  /* 접는 것은 넓은 화면 이야기입니다 — 작은 화면의 탭바는 아래에 가로로 붙어 있어 접을 폭이
     없습니다. 그래서 규칙을 min-width로 묶습니다. 안 묶으면 접어둔 채로 폰에서 열었을 때
     아래 탭바의 글자만 사라집니다(저장한 값은 화면 크기를 모릅니다). */
  @media (min-width: 721px) {
    body[data-nav="fold"] { --nav-w: 58px; }
    body[data-nav="fold"] .sidenav { padding-inline: 9px; }
    body[data-nav="fold"] .sidehead { justify-content: center; padding: 6px 0 14px; }
    body[data-nav="fold"] .sidebrand,
    body[data-nav="fold"] .sidetab span { display: none; }
    body[data-nav="fold"] .sidetab { justify-content: center; padding: 10px 0; }
    body[data-nav="fold"] .navfold svg { transform: rotate(180deg); }
  }
  .sidetab { display: flex; align-items: center; gap: 9px; padding: 9px 11px; border-radius: 9px;
             color: var(--muted); font-size: 14px; font-weight: 600; text-decoration: none; }
  .sidetab:hover { background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--fg); }
  .sidetab[aria-current="page"] { background: var(--accent-soft); color: var(--accent); font-weight: 800; }
  .sidetab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  .sideicon { flex: 0 0 auto; width: 17px; height: 17px;
              fill: none; stroke: currentColor; stroke-width: 1.5;
              stroke-linecap: round; stroke-linejoin: round; }
  /* 작은 화면에서는 아래로 내립니다. 위쪽은 제목·필터·날짜 머리글이 sticky로 붙어 있어서
     (top: 0 / 55px / 108px) 탭바를 거기 얹으면 그 값이 전부 어긋납니다. */
  @media (max-width: 720px) {
    body { padding-left: 0; padding-bottom: 64px; }
    .sidenav { top: auto; right: 0; width: auto; flex-direction: row; gap: 6px;
               padding: 6px 12px calc(6px + env(safe-area-inset-bottom));
               border-right: 0; border-top: 1px solid var(--line); }
    .sidehead { display: none; }
    .sidetab { flex: 1 1 0; justify-content: center; padding: 9px 6px; }
  }
</style>
</head>
<body>
<nav class="sidenav" id="sidenav" aria-label="화면 이동">
  <div class="sidehead">
    <span class="sidebrand">출조 레이더</span>
    <button type="button" class="navfold" id="navfold" aria-controls="sidenav" aria-expanded="true" aria-label="탭바 접기" title="탭바 접기"><svg class="sideicon" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3.5 5.5 8l4.5 4.5"></path></svg></button>
  </div>
  <a class="sidetab" href="index.html" title="현황" aria-current="page"><svg class="sideicon" viewBox="0 0 16 16" aria-hidden="true"><rect x="2" y="2.5" width="12" height="11" rx="2"></rect><path d="M2 6.5h12M6.5 6.5v7"></path></svg><span>현황</span></a>
  <a class="sidetab" href="admin.html" title="시스템"><svg class="sideicon" viewBox="0 0 16 16" aria-hidden="true"><path d="M3 5h10M3 11h10"></path><circle cx="6" cy="5" r="1.9"></circle><circle cx="10.5" cy="11" r="1.9"></circle></svg><span>시스템</span></a>
</nav>
<div class="wrap">
  <h1>출조 찾기</h1>
  <div class="sub"><span id="meta">불러오는 중…</span></div>
  <div class="sub" id="monitor-status" role="status">전체 목록은 약 60분 주기로 수집합니다. 관심 출조 감시는 로컬 서버에서 사용할 수 있습니다.</div>
  <details id="watch-panel" hidden><summary>감시 중인 출조 관리</summary><div id="watch-list" class="status"></div></details>
  <details id="alert-panel" hidden><summary>내가 받은 알림</summary><div id="alert-list" class="status"></div></details>

  <div class="controls">
    <div class="searchbar">
      <svg class="searchicon" viewBox="0 0 16 16" aria-hidden="true">
        <circle cx="6.8" cy="6.8" r="4.3"></circle><path d="M10 10 14.2 14.2"></path>
      </svg>
      <input type="search" id="f-q" placeholder="배 이름으로 찾기">
    </div>
  <div class="filters">
    <details class="multi" id="f-platform" data-label="플랫폼" data-all="전체 플랫폼"><summary>전체 플랫폼</summary><div class="multi-menu"></div></details>
    <details class="multi" id="f-site" data-label="선사" data-all="전체 선사"><summary>전체 선사</summary><div class="multi-menu"></div></details>
    <details class="multi" id="f-region" data-label="지역" data-all="전체 지역"><summary>전체 지역</summary><div class="multi-menu"></div></details>
    <details class="multi" id="f-port" data-label="항구" data-all="전체 항구"><summary>전체 항구</summary><div class="multi-menu"></div></details>
    <details class="multi" id="f-species" data-label="어종" data-all="전체 어종"><summary>전체 어종</summary><div class="multi-menu"></div></details>
    <details class="multi" id="f-session" data-label="운항" data-all="오전·오후·종일"><summary>오전·오후·종일</summary><div class="multi-menu"></div></details>
    <details class="multi" id="f-date" data-label="날짜" data-all="전체 날짜">
      <summary>전체 날짜</summary>
      <div class="multi-menu date-menu">
        <div class="date-head">
          <button type="button" class="date-nav" id="f-date-prev" aria-label="이전 달">‹</button>
          <strong id="f-date-month" aria-live="polite"></strong>
          <button type="button" class="date-nav" id="f-date-next" aria-label="다음 달">›</button>
        </div>
        <div class="date-week" aria-hidden="true"><span>일</span><span>월</span><span>화</span><span>수</span><span>목</span><span>금</span><span>토</span></div>
        <div class="date-grid" id="f-date-grid" role="grid" aria-label="출조 날짜 범위"></div>
        <p class="date-help" id="f-date-help">시작일을 선택하세요</p>
        <button type="button" class="date-clear" id="f-date-clear">전체 날짜로 초기화</button>
      </div>
    </details>
    <select id="f-sort" aria-label="정렬">
      <option value="default">기본순 (빈자리 · 출항 시각)</option>
      <option value="seats-desc">잔여석 많은순</option>
      <option value="seats-asc">잔여석 적은순</option>
      <option value="price-asc">승선료 낮은순</option>
      <option value="rate-desc">내 별점 높은순</option>
      <option value="checked-desc">최신 확인순</option>
    </select>
    <label class="check"><input type="checkbox" id="f-open" checked> 빈자리만</label>
    <label class="check"><input type="checkbox" id="f-fav"> <span id="f-fav-label">★ 즐겨찾기만</span></label>
    <label class="check"><input type="checkbox" id="f-rated"> <span id="f-rated-label">★ 별점 준 배만</span></label>
  </div>
  </div>

  <div class="views">
    <button id="view-table" class="on">표</button>
    <button id="view-map">지도</button>
  </div>

  <div id="map" hidden></div>
  <div class="maphint" id="maphint" hidden></div>

  <div class="pager" id="pager-top" hidden></div>

  <div class="tablewrap" id="tablewrap">
    <table>
      <thead><tr>
        <th class="starcell"></th><th>날짜</th><th>선사</th><th>배</th><th>상태</th><th class="num">잔여</th>
        <th>항구</th><th>어종</th><th class="num">승선료</th><th>운항</th><th>구분</th><th>감시·최신화</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="empty" hidden>조건에 맞는 출조가 없습니다.</div>
  </div>

  <div class="pager" id="pager-bottom" hidden></div>

  <details>
    <summary>수집 상태</summary>
    <div class="status" id="status"></div>
  </details>
</div>

<script>
const LABEL = { open: '예약가능', few: '잔여 적음', closed: '마감', off: '휴항', unknown: '확인필요' };

// 배가 안 뜨는 이유가 기상이 아니라 정비·점검이면 그렇게 적습니다. 자리가 남은 채로
// 배정비일이 되는 날이 있어서(무창포 대진피싱) "휴항"이라고만 적으면 예약판을 열어보고
// 나서야 이유를 압니다. 색과 정렬은 휴항과 같습니다 — 어느 쪽이든 못 잡는 자리입니다.
function statusLabel(trip) {
  if (trip.status === 'off' && /(?:배|선박)\s*(?:정비|점검|수리)|(?:정비|점검)\s*중/.test(trip.statusText ?? '')) {
    return '정비';
  }
  return LABEL[trip.status] ?? trip.status;
}
const WEEK = ['일','월','화','수','목','금','토'];
let DATA = { trips: [], sites: {}, ports: {}, generatedAt: null };
let MONITOR = null;
const watchKey = (t) => [t.siteId, t.boat ?? '', t.date ?? '', t.departAt ?? ''].join('|');
const watched = (t) => MONITOR?.watches.some((w) => (t.sources ?? [t]).some((s) =>
  watchKey({ ...t, siteId: s.siteId }) === watchKey(w)));

function freshness(t) {
  const states = (t.sources ?? [t]).map((s) => DATA.sites[s.siteId]);
  const failed = states.some((s) => !s?.ok && !s?.skipped);
  const held = !failed && states.some((s) => !s?.ok && s?.skipped);
  const times = states.map((s) => Date.parse(s?.ok ? s.at : s?.keptFrom));
  const time = Math.min(...times);
  if (!Number.isFinite(time)) {
    const prefix = failed ? '수집 실패 · ' : held ? '수집 보류 · ' : '';
    return { text: `${prefix}확인 시각 없음`, stale: true, failed };
  }
  const minutes = Math.max(0, Math.floor((Date.now() - time) / 60000));
  const age = minutes >= 1440
    ? `${Math.floor(minutes / 1440)}일 전 확인`
    : minutes >= 60
      ? `${Math.floor(minutes / 60)}시간 ${minutes % 60}분 전 확인`
      : `${minutes}분 전 확인`;
  const prefix = failed ? '수집 실패 · 직전 ' : held ? '수집 보류 · 직전 ' : '';
  return { text: `${prefix}${age}`, stale: failed || held || minutes >= 30, failed };
}

/**
 * 내 감시가 잡은 알림 이력. 알림이 갔는지 못 갔는지를 화면에서 확인할 수 있어야 합니다 —
 * 텔레그램이 조용하면 "자리가 안 났다"인지 "알림이 막혔다"인지 알 수가 없습니다.
 */
async function loadAlerts() {
  if (!WATCH_API) return;
  try {
    const r = await fetch('/api/alerts', { headers: watchHeaders() });
    if (!r.ok) return;
    const { alerts } = await r.json();
    const list = $('alert-list');
    list.textContent = '';
    $('alert-panel').hidden = false;
    $('alert-panel').querySelector('summary').textContent = `내가 받은 알림 ${alerts.length}건`;

    if (!alerts.length) {
      list.textContent = '아직 없습니다. 감시를 걸어두면 자리가 났을 때 여기에 남습니다.';
      return;
    }
    for (const a of alerts) list.append(alertRow(a));
  } catch { /* 서버가 없으면 조용히 접습니다 — reload()가 이미 알려줍니다 */ }
}

function alertRow(a) {
  const row = document.createElement('div');
  const when = a.at ? new Date(a.at).toLocaleString('ko-KR') : '시각 미상';
  const what = a.reason === 'reopened' ? '취소석' : `자리 늘어남 ${a.before ?? '-'}→${a.after ?? '-'}`;
  row.append(`${when} · ${a.date ?? ''} ${a.departAt ?? ''} ${a.boat ?? ''} · ${what} `);

  if (a.url) {
    const link = document.createElement('a');
    link.href = a.url; link.target = '_blank'; link.rel = 'noopener noreferrer';
    link.textContent = a.urlDated ? '예약 화면' : '일정표';
    row.append(link, ' ');
  }

  // 알림이 실제로 갔는지가 이 화면의 핵심입니다.
  const mark = document.createElement('span');
  const failed = a.notify?.failed ?? [];
  if (failed.length) {
    mark.className = 'fail';
    mark.textContent = `알림 실패 (${failed.map((f) => `${f.channel}: ${f.error}`).join(', ')})`;
  } else if (a.notify?.sent?.length) {
    mark.textContent = `알림 보냄 (${a.notify.sent.join(', ')})`;
  } else {
    mark.className = 'fail';
    mark.textContent = a.notify?.skipped === 'no-credentials'
      ? '알림 채널 미설정 — 화면에만 남았습니다' : '알림 못 보냄';
  }
  row.append(mark);
  return row;
}

function monitorMessage() {
  if (!MONITOR) return;
  $('monitor-status').textContent = `전체 60분 · 관심 출조 ${MONITOR.watches.length}개, 3분 목표 · 서버가 켜져 있는 동안 감시` +
    (MONITOR.overdue ? ` · ${MONITOR.overdue}곳 확인 지연` : '') +
    (MONITOR.notificationConfigured ? ' · 외부 알림 설정됨' : ' · 외부 알림 미설정: 텔레그램/디스코드 환경변수가 필요합니다');
  $('watch-panel').hidden = false;
  $('watch-list').textContent = '';
  for (const w of MONITOR.watches) {
    const row = document.createElement('div'), button = document.createElement('button');
    row.append(`${w.date} ${w.departAt ?? ''} ${w.boat ?? ''} (${w.siteId}) `);
    button.className = 'watch'; button.textContent = '감시 해제';
    button.onclick = () => toggleWatch(w, button);
    row.append(button); $('watch-list').append(row);
  }
}

// 감시 목록은 사람마다 다릅니다. 계정을 만들지 않는 대신 브라우저가 토큰 하나를 만들어
// 보관하고, 서버는 그 해시로 목록을 나눠 둡니다(core/watchers.js). 즐겨찾기·별점과 같은
// 급의 개인 기록이라 로그인을 시키면 아무도 안 씁니다.
// 토큰을 지우면 그 목록은 못 찾습니다 — 기기 간 동기화는 따로 볼 일입니다.
const WATCHER_KEY = 'fishing:watcher';

function watcherToken() {
  try {
    const saved = localStorage.getItem(WATCHER_KEY);
    if (saved) return saved;
    const made = (crypto.randomUUID?.() ?? String(Math.random()).slice(2) + Date.now());
    localStorage.setItem(WATCHER_KEY, made);
    return made;
  } catch {
    // 저장을 막아둔 브라우저. 이번 세션에서만 쓰는 토큰이라 새로고침하면 목록을 잃습니다.
    WATCHER_FALLBACK ??= String(Math.random()).slice(2) + Date.now();
    return WATCHER_FALLBACK;
  }
}

let WATCHER_FALLBACK = null;
const watchHeaders = (extra = {}) => ({ 'X-Admin': '1', 'X-Watcher': watcherToken(), ...extra });

async function toggleWatch(t, button) {
  button.disabled = true;
  try {
    const r = await fetch('/api/monitor', { method: 'POST', headers: watchHeaders({ 'Content-Type': 'application/json' }),
      body: JSON.stringify({ key: watchKey(t), enabled: !watched(t) }) });
    const d = await r.json();
    if (!r.ok) throw new Error(d.error ?? '감시 설정 실패');
    MONITOR = d; monitorMessage(); void loadAlerts();
    // 버튼 문구 하나 바뀌자고 표를 다시 그리지 않습니다. 감시 상태만 고쳐 그립니다.
    for (const row of ROW_BUTTONS) if (row.watch) paintWatch(row.watch, row.trip);
    button.disabled = false;   // 표를 다시 그리지 않으니 여기서 풀어줘야 합니다
  } catch (e) { $('monitor-status').textContent = e.message; button.disabled = false; }
}

const tripSources = (t) => t.sources?.length ? t.sources
  : [{ siteId: t.siteId, siteName: t.siteName, url: t.url, seatsLeft: t.seatsLeft, urlDated: t.urlDated }];

// 전체 290곳을 다시 돌리지 않고 이 출처 하나만 즉시 수집합니다. 완료 시각이 바뀔 때까지
// 기다린 뒤 화면 데이터를 한 번만 다시 읽습니다. 이 API는 로컬 관리자에게만 열립니다.
async function refreshSite(siteId, button) {
  const original = button.textContent;
  const before = DATA.sites[siteId]?.at ?? null;
  button.disabled = true;
  button.textContent = '최신화 중…';
  try {
    const r = await fetch(`/api/collect/${encodeURIComponent(siteId)}`, {
      method: 'POST', headers: { 'X-Admin': '1' },
    });
    const reply = await r.json();
    if (!r.ok) throw new Error(reply.error ?? '선사 최신화 요청 실패');

    for (let second = 0; second < 90; second++) {
      await new Promise((resolve) => setTimeout(resolve, 1000));
      const next = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' }).then((res) => res.json());
      const after = next.sites?.[siteId]?.at ?? null;
      if (after && after !== before) {
        await reload();
        return;
      }
    }
    throw new Error(`${DATA.sites[siteId]?.name ?? siteId} 최신화가 지연되고 있습니다`);
  } catch (error) {
    $('monitor-status').textContent = error.message;
    button.disabled = false;
    button.textContent = original;
  }
}

// ── 즐겨찾기 ──────────────────────────────────────────────────────────────
// 브라우저에만 저장합니다. 서버가 없으니 기기마다 따로 남습니다.
// 배 이름만으로는 안 됩니다 — 다른 지역에 같은 이름의 배가 있어서, 출항지까지 묶습니다.
const FAV_KEY = 'fishing:favorites';
const favKey = (t) => `${t.boat ?? ''}|${t.port ?? ''}`;

function loadFavs() {
  try { return new Set(JSON.parse(localStorage.getItem(FAV_KEY) ?? '[]')); } catch { return new Set(); }
}
function saveFavs() {
  try { localStorage.setItem(FAV_KEY, JSON.stringify([...FAVS])); } catch { /* 저장이 막혀도 이번 세션은 됩니다 */ }
}
const favLabel = () => (FAVS.size ? `★ 즐겨찾기만 (${FAVS.size})` : '★ 즐겨찾기만');

function toggleFav(t) {
  const k = favKey(t);
  if (!FAVS.delete(k)) FAVS.add(k);
  saveFavs();
  $('f-fav-label').textContent = favLabel();
  // "즐겨찾기만"이 켜져 있으면 별을 빼는 순간 그 줄이 사라져야 합니다. 그때만 다시 그립니다.
  if ($('f-fav').checked) { refresh(); return; }
  // 같은 배가 여러 날에 여러 줄로 나옵니다(키가 이름+출항지라서). 키가 같은 별을 다 같이 고칩니다.
  const on = FAVS.has(k);
  for (const row of ROW_BUTTONS) if (favKey(row.trip) === k) paintStar(row.star, on);
}
let FAVS = loadFavs();

// 항구는 registry에서 오고 사람이 고칩니다. 고치면 키가 어긋나서 별을 눌러둔 배가
// 조용히 사라집니다(바하호가 백사장항→구매항으로 바뀌면서 실제로 그랬습니다).
// 같은 이름의 배가 지금 목록에 딱 하나뿐일 때만 새 키로 옮깁니다. 둘 이상이면
// 어느 쪽인지 알 수 없으니 그냥 둡니다 — 엉뚱한 배를 즐겨찾기하느니 안 옮깁니다.
function migrateFavs(trips) {
  const live = new Set(), byBoat = new Map();
  for (const t of trips) {
    const key = favKey(t);
    live.add(key);
    const boat = t.boat ?? '';
    if (!byBoat.has(boat)) byBoat.set(boat, new Set());
    byBoat.get(boat).add(key);
  }
  let moved = 0;
  for (const key of [...FAVS]) {
    if (live.has(key)) continue;
    const keys = byBoat.get(key.slice(0, key.indexOf('|')));
    if (keys?.size !== 1) continue;
    FAVS.delete(key);
    FAVS.add([...keys][0]);
    moved++;
  }
  if (moved) saveFavs();
}

// "조건에 맞는 출조가 없습니다" 한 줄로는 즐겨찾기가 비어서인지, 별 눌러둔 배가
// 목록에서 없어져서인지, 어종·날짜 필터에 걸려서인지 알 수가 없습니다. 셋을 갈라 말합니다.
function emptyMessage() {
  // 별점 이야기는 별점 블록에 있습니다(둘 다 켜져 있으면 즐겨찾기 쪽이 더 좁은 조건입니다).
  if ($('f-rated').checked && !$('f-fav').checked) return ratedEmptyMessage();
  if (!$('f-fav').checked) return '조건에 맞는 출조가 없습니다.';
  if (!FAVS.size) return '즐겨찾기가 없습니다. 표 왼쪽 ☆를 누르면 담깁니다(이 브라우저에만 저장됩니다).';
  if (!DATA.trips.some((t) => FAVS.has(favKey(t)))) {
    return `즐겨찾기 ${FAVS.size}개가 지금 목록에 없습니다. 배 이름이나 항구가 바뀌었을 수 있습니다 — 시스템 관리 → 즐겨찾기에서 확인하세요.`;
  }
  return `즐겨찾기 ${FAVS.size}개가 다른 필터(어종·날짜·빈자리 등)에 걸려 있습니다. 필터를 풀어보세요.`;
}
// ── 즐겨찾기 끝 ── (test/page.test.js가 이 표시까지를 떼어내 돌려봅니다)

// ── 별점 ──────────────────────────────────────────────────────────────────
// 배별 별점은 **표에서 바로 매깁니다.** 잘못 눌러 점수가 조용히 바뀌는 것은 두 번 눌러야
// 바뀌게 해서 막습니다 — 한 번 누르면 고르는 칸이 열릴 뿐이고, 거기서 점수를 골라야
// 저장됩니다. 시스템 관리 화면에서도 매길 수 있고(거기서는 선사·배 목록으로 훑습니다)
// 저장 형식(키·1~5점)은 두 화면이 같아야 합니다.
const RATE_KEY = 'fishing:boat-ratings';
const RATE_MAX = 5;
const rateKey = (siteId, boat) => siteId && boat ? `${siteId}|${boat}` : '';

function loadRates() {
  try {
    const raw = JSON.parse(localStorage.getItem(RATE_KEY) ?? '{}');
    return raw && typeof raw === 'object' && !Array.isArray(raw) ? raw : {};
  } catch { return {}; }
}
function rateOf(map, id) {
  const n = Number(map?.[id]);
  return Number.isInteger(n) && n >= 1 && n <= RATE_MAX ? n : 0;
}
const rateStars = (score) => '★'.repeat(score) + '☆'.repeat(RATE_MAX - score);

// 안 매긴 배에는 아무것도 안 붙입니다. 모든 출조에 ☆☆☆☆☆가 깔리면 표가 안 읽힙니다.
// 고르는 칸은 화면에 하나만 만들어 옮겨 씁니다. 줄마다 만들면 한 쪽에 1200개가 생깁니다.
let RATE_POP = null;
let RATE_POP_TRIP = null;

function ratePop() {
  if (RATE_POP) return RATE_POP;
  RATE_POP = document.createElement('div');
  RATE_POP.className = 'ratepop';
  RATE_POP.hidden = true;
  RATE_POP.setAttribute('role', 'group');
  for (let n = 1; n <= RATE_MAX; n++) {
    const pick = document.createElement('button');
    pick.type = 'button';
    pick.dataset.score = String(n);
    pick.addEventListener('click', () => chooseRate(n));
    RATE_POP.append(pick);
  }
  const clear = document.createElement('button');
  clear.type = 'button';
  clear.className = 'clear';
  clear.textContent = '지우기';
  clear.addEventListener('click', () => chooseRate(0));
  RATE_POP.append(clear);
  document.body.append(RATE_POP);
  return RATE_POP;
}

function chooseRate(score) {
  const trip = RATE_POP_TRIP;
  closeRatePop();
  if (!trip) return;
  // 지금 점수를 다시 고르면 지웁니다 — 0점을 따로 두면 "안 매김"과 구별이 안 됩니다.
  applyRate(trip, rateOfTrip(trip) === score ? 0 : score);
}

// 안을 누른 것(점수 고르기)은 그대로 두고, 바깥을 누르면 닫습니다.
function closeRatePopOutside(target) {
  if (RATE_POP && !RATE_POP.hidden && !RATE_POP.contains(target)) closeRatePop();
}

function closeRatePop() {
  if (RATE_POP) RATE_POP.hidden = true;
  RATE_POP_TRIP = null;
}

function openRatePop(button, trip) {
  const pop = ratePop();
  const same = RATE_POP_TRIP === trip && !pop.hidden;
  closeRatePop();
  if (same) return;                       // 같은 별을 다시 누르면 닫기만 합니다
  RATE_POP_TRIP = trip;
  const score = rateOfTrip(trip);
  for (const pick of pop.querySelectorAll('button[data-score]')) {
    const n = Number(pick.dataset.score);
    pick.className = n <= score ? 'on' : '';
    pick.textContent = n <= score ? '★' : '☆';
    pick.title = n === score ? `${n}점 — 다시 누르면 지웁니다` : `${n}점 주기`;
    pick.setAttribute('aria-label', `${trip.boat ?? ''} ${pick.title}`);
  }
  pop.querySelector('.clear').hidden = !score;
  pop.hidden = false;
  // 버튼 아래에 답니다. 오른쪽 끝 줄에서 화면 밖으로 나가지 않게 당겨둡니다.
  const at = button.getBoundingClientRect();
  const width = pop.offsetWidth;
  const left = Math.max(8, Math.min(at.left + window.scrollX, window.scrollX + document.documentElement.clientWidth - width - 8));
  pop.style.left = `${left}px`;
  pop.style.top = `${at.bottom + window.scrollY + 5}px`;
}

// 어디서 온 출조인지 한눈에. 이 화면의 존재 이유가 "선상24 밖도 같이 본다"인데,
// 배지가 없으면 지금 보고 있는 줄이 어디 것인지 알 수가 없습니다.
function platformChip(siteId) {
  const chip = document.createElement('span');
  chip.className = 'srcchip';
  chip.textContent = platformOf(DATA.sites, siteId);
  return chip;
}

function rateForTrip(trip) {
  const ids = [trip.siteId, ...(trip.sources ?? []).map((source) => source.siteId)];
  for (const siteId of new Set(ids)) {
    const score = rateOf(RATES, rateKey(siteId, trip.boat));
    if (score) return score;
  }
  return 0;
}

// 별점 찾기는 출조마다 배열과 Set을 새로 만듭니다. 줄마다 한 번이면 괜찮지만, 거르기와
// 정렬은 1만 건을 훑는 자리(거르기 1만 번 · 정렬은 그보다 더)라 거기서 그대로 부르면
// 거르기 한 번에 수만 개를 만듭니다 — Intl.DateTimeFormat으로 3초를 태운 그 자리입니다.
// 출조마다 한 번만 재고 기억해 둡니다. RATES가 바뀌면 통째로 버립니다(아래 clearRateCache).
let RATE_CACHE = new WeakMap();
function rateOfTrip(trip) {
  let score = RATE_CACHE.get(trip);
  if (score === undefined) RATE_CACHE.set(trip, score = rateForTrip(trip));
  return score;
}
function clearRateCache() { RATE_CACHE = new WeakMap(); }

const ratedCount = () => Object.keys(RATES).filter((id) => rateOf(RATES, id)).length;
const ratedLabel = () => (ratedCount() ? `★ 별점 준 배만 (${ratedCount()})` : '★ 별점 준 배만');

function saveRates() {
  try { localStorage.setItem(RATE_KEY, JSON.stringify(RATES)); return true; }
  catch { return false; }
}

// 안 매긴 배는 ☆ 하나입니다. 모든 줄에 ☆☆☆☆☆가 깔리면 표가 안 읽힙니다.
function paintRate(button, score) {
  button.className = 'ratebtn' + (score ? ' on' : '');
  button.textContent = score ? rateStars(score) : '☆';
  button.title = score ? `내 별점 ${score}점 — 눌러서 고치기` : '내 별점 매기기';
  button.setAttribute('aria-label', button.title);
}

/**
 * 점수를 저장하고, 표를 다시 그리지 않고 **별만 고쳐 그립니다**(별 하나에 표를 다시
 * 그리면 178ms씩 멈춥니다 — 즐겨찾기가 그렇습니다). 같은 배가 여러 날에 여러 줄로
 * 나오고 합쳐진 줄은 출처가 여럿이라, 한 줄만 고치면 나머지가 어긋납니다.
 * 저장이 막히면 없던 일로 되돌립니다 — 화면만 바뀌면 다음에 열 때 사라집니다.
 */
function applyRate(trip, score) {
  const key = rateKey(trip.siteId, trip.boat);
  if (!key) return false;
  const before = { ...RATES };
  if (score) RATES[key] = score;
  else delete RATES[key];
  if (!saveRates()) { RATES = before; return false; }
  clearRateCache();
  for (const row of ROW_BUTTONS) if (row.rate) paintRate(row.rate, rateOfTrip(row.trip));
  $('f-rated-label').textContent = ratedLabel();
  // "별점 준 배만"이 켜져 있으면 점수를 지우는 순간 그 줄이 사라져야 합니다.
  if ($('f-rated').checked) refresh();
  return true;
}

// "조건에 맞는 출조가 없습니다" 한 줄로는 별점을 안 매겨서인지, 매긴 배가 지금 목록에
// 없어서인지, 다른 필터에 걸려서인지 알 수 없습니다. 즐겨찾기와 같은 이유로 셋을 갈라 말합니다.
// 배 이름이 수집 결과와 다르면 그 별점은 영영 안 뜨므로, 둘째 경우에는 고치는 곳까지 적습니다.
function ratedEmptyMessage() {
  if (!ratedCount()) {
    return '별점을 준 배가 없습니다. 시스템 관리 화면에서 배별로 매기면 여기서 걸러 볼 수 있습니다.';
  }
  if (!DATA.trips.some((t) => rateOfTrip(t) > 0)) {
    return `별점을 준 배 ${ratedCount()}척이 지금 목록에 없습니다. 배 이름이 수집 결과와 다를 수 있습니다 — 시스템 관리 → "현황판에 안 보이는 별점"에서 확인하세요.`;
  }
  return '별점을 준 배가 다른 필터(어종·날짜·빈자리 등)에 걸려 있습니다. 필터를 풀어보세요.';
}

let RATES = loadRates();
// ── 별점 끝 ── (test/page.test.js가 이 표시까지를 떼어내 돌려봅니다)

const $ = (id) => document.getElementById(id);
const won = (n) => n == null ? '' : n.toLocaleString('ko-KR') + '원';
const seatsLabel = (t) => {
  if (!Number.isFinite(t.seatsLeft)) {
    return ['open', 'few', 'unknown'].includes(t.status) ? '선사 확인' : '';
  }
  return Number.isFinite(t.seatsTotal) ? `${t.seatsLeft}/${t.seatsTotal}` : String(t.seatsLeft);
};

// ── 전화 걸기 ────────────────────────────────────────────────────────────
// 취소석은 화면으로 보고 전화로 잡습니다. 번호는 시스템 관리에서 registry에 적어둔 값이
// 그대로 실려 옵니다(core/runner.js의 meta, core/schema.js의 pickPhone) — 관리 화면에만
// 있으면 자리를 찾은 사람이 배 이름을 들고 다시 검색해야 합니다.
//
// 표기가 제각각(010-1234-5678 / 010.1234.5678 / 051 123 4567)이라 tel: 에는 숫자만 넣고,
// 보여주는 글자는 적어둔 표기 그대로 둡니다 — 사람이 눈으로 맞춰보는 값입니다.
function phoneHref(phone) {
  const digits = String(phone ?? '').replace(/[^0-9+]/g, '');
  return digits.length >= 3 ? 'tel:' + digits : null;
}

function phoneLink(phone) {
  const href = phoneHref(phone);
  if (!href) return null;
  const a = document.createElement('a');
  a.className = 'phone';
  a.href = href;
  a.textContent = '\u260e ' + String(phone).trim();
  a.title = '선사에 바로 겁니다. 취소석은 전화가 제일 빠릅니다.';
  return a;
}
// ── 전화 걸기 끝 ── (test/page.test.js가 이 표시까지를 떼어내 돌려봅니다)

// 04:00 출항해서 17:00 들어오면 "04:00~17:00". 끝 시각을 모르면 시작만.
const runLabel = (t) => {
  if (t.departAt && t.departThrough) return `${t.departAt}~${t.departThrough} 출항`;
  if (t.departAt) return t.returnAt ? `${t.departAt}~${t.returnAt}` : t.departAt;
  if (t.meetingAt) return `${t.meetingAt}까지 도착`;
  return '선사 확인';
};

// "종일 13시간" — 몇 시간짜리인지가 오전배냐 종일배냐만큼 중요합니다.
function sessionLabel(t) {
  if (!t.session) return '';
  const h = t.hours == null ? '' : ` ${String(t.hours).replace(/\.0$/, '')}시간`;
  return t.session + h;
}

function dayLabel(d) {
  const [y, m, dd] = d.split('-').map(Number);
  return `${m}/${dd}(${WEEK[new Date(y, m - 1, dd).getDay()]})`;
}

// 조금 앞뒤로 물살이 죽는 며칠이 좋은 물때입니다. 12물부터 조금·무시를 지나 1~4물까지.
//
// **같은 날을 사이트마다 다르게 부릅니다.** 수집 결과를 날짜별로 훑어보면 이렇습니다
// (2026-09-16 하루에 붙은 표기: `12물` 235건 · `한객기` 150건 · `13물` 108건).
//
//   9/16  12물 = 한객기      9/18  조금 = 14물
//   9/17  13물 = 대객기      9/19  무시 = 15물
//
// 이름으로 부르는 곳과 숫자로 부르는 곳이 섞여 있고, 지역에 따라 하루씩 밀리기도 합니다
// (같은 날 `3물`과 `4물`이 같이 나옵니다). 표기를 하나로 고쳐 쓰지는 않습니다 — 어느 쪽도
// 틀린 게 아니고, 사이트가 그렇게 적어둔 것을 우리가 바꿔 보여줄 이유가 없습니다.
//
// 대신 **판단은 표기와 무관해야 합니다.** 안 그러면 같은 날인데 선사에 따라 배지가 붙었다
// 안 붙었다 합니다 — 실제로 한객기·대객기·14물·15물이 그렇게 빠지고 있었습니다.
const GOOD_TIDE_NAMES = new Set(['조금', '무시', '한객기', '대객기']);

function isGoodTide(tide) {
  if (!tide) return false;
  if (GOOD_TIDE_NAMES.has(tide)) return true;
  const n = Number(String(tide).match(/^(\d{1,2})물$/)?.[1]);
  return (n >= 12 && n <= 15) || (n >= 1 && n <= 4);
}

// 물때는 날짜별로 한 번만 모읍니다. 날짜 머리글마다 그 쪽 전체를 다시 훑으면
// 한 쪽(3천 줄)을 그릴 때마다 2만 번씩 봅니다.
function tidesByDate(rows) {
  const counts = new Map();
  for (const t of rows) {
    if (!t.tide) continue;
    if (!counts.has(t.date)) counts.set(t.date, new Map());
    const day = counts.get(t.date);
    day.set(t.tide, (day.get(t.tide) ?? 0) + 1);
  }
  // 한 날에 표기가 여럿이면 **많이 쓰인 것부터** 보여줍니다. 그 날 대부분의 선사가 그렇게
  // 부른다는 뜻이라, 사용자가 자기 물때표와 맞춰보기 쉽습니다. 소수 표기도 버리지는
  // 않습니다 — 어느 쪽도 틀린 게 아닙니다.
  const map = new Map();
  for (const [date, day] of counts) {
    map.set(date, new Set([...day.entries()].sort((a, b) => b[1] - a[1]).map(([tide]) => tide)));
  }
  return map;
}

function dayTideParts(date, tides) {
  const list = [...(tides ?? [])];
  return { label: list.length ? `${dayLabel(date)} · ${list.join(' / ')}` : dayLabel(date), good: list.some(isGoodTide) };
}

// Intl.DateTimeFormat은 만드는 데만 0.3ms쯤 듭니다. 출조마다 새로 만들면 1만 건을
// 거르는 데 3초가 걸렸습니다(검색어 한 글자당 그게 세 번). 한 번 만들어 두고 씁니다.
const KST_FORMAT = new Intl.DateTimeFormat('en-CA', {
  timeZone: 'Asia/Seoul', year: 'numeric', month: '2-digit', day: '2-digit',
  hour: '2-digit', minute: '2-digit', hourCycle: 'h23',
});

function kstParts(now = new Date()) {
  const parts = KST_FORMAT.formatToParts(now).reduce((acc, part) => (acc[part.type] = part.value, acc), {});
  return { date: `${parts.year}-${parts.month}-${parts.day}`, minutes: Number(parts.hour) * 60 + Number(parts.minute) };
}

const HIDE_TODAY_AFTER = 15 * 60;
// 기준 시각은 부르는 쪽에서 한 번만 구해 넘깁니다. 출조마다 다시 구할 값이 아닙니다.
function showTripByTime(t, kst = kstParts()) {
  return !(t.date === kst.date && kst.minutes >= HIDE_TODAY_AFTER);
}

// 어종은 '주꾸미·갑오징어'처럼 여러 개가 붙어 옵니다(core/schema.js가 그렇게 모읍니다).
// 필터는 하나씩 걸어야 하니 나눠서 봅니다 — 쭈갑 출조는 주꾸미로도, 갑오징어로도 잡힙니다.
// 값이 없는 출조를 필터에서 빼면 "왜 이 배가 안 보이지"가 됩니다(항구가 그랬습니다).
// 어종을 모르는 출조가 656건, 운항 시각을 모르는 출조가 4019건입니다 — 시각은
// 예약판에 아예 안 적혀 있어서(안내문자로 알려주는 곳들) 캘 수가 없습니다.
// 없는 값도 한 칸으로 모아 골라 볼 수 있게 합니다.
const NO_SPECIES = '(어종 미상)';
const NO_SESSION = '(운항 미상)';
const speciesOf = (t) => {
  const names = String(t.species ?? '').split('·').filter(Boolean);
  return names.length ? names : [NO_SPECIES];
};
const sessionOf = (t) => t.session ?? NO_SESSION;

// 항구는 registry에 사람이 적습니다. 지금은 사이트 288곳 중 262곳이 비어 있어서
// 출조 대부분에 항구가 없습니다. 그냥 두면 지역·항구 필터를 거는 순간 그 배들이
// 이유 없이 사라집니다. 골라서 볼 수 있게 한 칸으로 모읍니다.
const NO_PORT = '(항구 미상)';
const portOf = (t) => t.port ?? NO_PORT;

function regionOf(port) {
  if (!port) return NO_PORT;
  const parts = String(port).trim().split(/\s+/);
  if (parts.length >= 3) return `${parts[0]} ${parts[1]}`;
  if (parts.length >= 2 && /(?:시|군|구)$/.test(parts[1])) return `${parts[0]} ${parts[1]}`;
  return parts[0] ?? NO_PORT;
}

// 어느 예약 플랫폼에서 온 출조인가. 계열 표기는 data.json의 사이트 상태에 실려 옵니다
// (registry를 화면에서는 못 읽습니다). "더피싱(상세)"의 (상세)는 우리가 어떻게 긁는지일 뿐
// 사용자에겐 같은 더피싱이라 떼고 보여줍니다.
const UNKNOWN_PLATFORM = '(미상)';

function platformOf(sites, siteId) {
  const label = sites?.[siteId]?.platform;
  return label ? String(label).replace(/\(상세\)$/, '') : UNKNOWN_PLATFORM;
}

/** 합쳐진 줄은 여러 플랫폼에서 왔습니다. 그중 하나만 걸어도 걸리게 전부 돌려줍니다. */
function platformsOf(sites, trip) {
  const ids = (trip.sources?.length ? trip.sources : [trip]).map((s) => s.siteId);
  return [...new Set(ids.map((id) => platformOf(sites, id)))];
}

function fillOptions(control, values, defaults = []) {
  const menu = control.querySelector('.multi-menu');
  if (control.dataset.loaded) defaults = [...selectedValues(control.id)];
  control.dataset.loaded = '1';
  menu.textContent = '';
  for (const v of [...new Set(values.filter(Boolean))].sort()) {
    const label = document.createElement('label');
    const input = document.createElement('input');
    input.type = 'checkbox';
    input.value = v;
    input.checked = defaults.includes(v);
    input.dataset.text = v;
    input.addEventListener('change', () => { updateMultiLabel(control); filtered(); });
    label.append(input, input.dataset.text);
    menu.append(label);
  }
  updateMultiLabel(control);
}

function selectedValues(id) {
  return new Set([...$(id).querySelectorAll('input:checked')].map((input) => input.value));
}

function hasSelection(values, value) {
  return !values.size || values.has(value);
}

function updateMultiLabel(control) {
  const checked = [...control.querySelectorAll('input:checked')];
  const summary = control.querySelector('summary');
  control.dataset.selected = checked.length ? '1' : '0';
  if (!checked.length) {
    summary.textContent = control.dataset.all;
  } else if (checked.length === 1) {
    summary.textContent = checked[0].dataset.text;
  } else {
    summary.textContent = `${control.dataset.label} ${checked.length}개`;
  }
}

function setOnlyFilterValue(id, value) {
  for (const input of $(id).querySelectorAll('input')) input.checked = input.value === value;
  updateMultiLabel($(id));
}

let DATE_RANGE = { start: null, end: null };
let DATE_MIN = '';
let DATE_MAX = '';
let DATE_MONTH = '';

function dateRange() { return { ...DATE_RANGE }; }

function chooseDateRange(range, value) {
  if (!range.start || range.end) return { start: value, end: null };
  const [start, end] = [range.start, value].sort();
  return { start, end };
}

function inDateRange(value, { start, end }) {
  return (!start || value >= start) && (!end || value <= end);
}

function updateDateRangeLabel() {
  const { start, end } = dateRange();
  const control = $('f-date');
  control.dataset.selected = start || end ? '1' : '0';
  control.querySelector('summary').textContent = start && end
    ? (start === end ? dayLabel(start) : `${dayLabel(start)}~${dayLabel(end)}`)
    : start ? `${dayLabel(start)}부터`
      : end ? `${dayLabel(end)}까지` : control.dataset.all;
}

function moveMonth(month, delta) {
  const [year, number] = month.split('-').map(Number);
  const moved = new Date(Date.UTC(year, number - 1 + delta, 1));
  return `${moved.getUTCFullYear()}-${String(moved.getUTCMonth() + 1).padStart(2, '0')}`;
}

function renderDateCalendar() {
  const grid = $('f-date-grid');
  grid.textContent = '';
  if (!DATE_MONTH) return;

  const [year, month] = DATE_MONTH.split('-').map(Number);
  $('f-date-month').textContent = `${year}년 ${month}월`;
  $('f-date-prev').disabled = Boolean(DATE_MIN && moveMonth(DATE_MONTH, -1) < DATE_MIN.slice(0, 7));
  $('f-date-next').disabled = Boolean(DATE_MAX && moveMonth(DATE_MONTH, 1) > DATE_MAX.slice(0, 7));

  const frag = document.createDocumentFragment();
  const firstWeekday = new Date(Date.UTC(year, month - 1, 1)).getUTCDay();
  const lastDay = new Date(Date.UTC(year, month, 0)).getUTCDate();
  for (let i = 0; i < firstWeekday; i++) {
    const blank = document.createElement('span');
    blank.className = 'date-blank';
    frag.append(blank);
  }
  for (let day = 1; day <= lastDay; day++) {
    const value = `${DATE_MONTH}-${String(day).padStart(2, '0')}`;
    const button = document.createElement('button');
    button.type = 'button';
    button.textContent = day;
    button.dataset.date = value;
    button.disabled = Boolean((DATE_MIN && value < DATE_MIN) || (DATE_MAX && value > DATE_MAX));
    button.setAttribute('aria-label', dayLabel(value));
    button.setAttribute('aria-pressed', String(value === DATE_RANGE.start || value === DATE_RANGE.end));
    if (DATE_RANGE.start && DATE_RANGE.end && value > DATE_RANGE.start && value < DATE_RANGE.end) {
      button.classList.add('in-range');
    }
    if (value === DATE_RANGE.start) button.classList.add('range-start');
    if (value === DATE_RANGE.end) button.classList.add('range-end');
    button.addEventListener('click', () => selectCalendarDate(value));
    frag.append(button);
  }
  grid.append(frag);

  const { start, end } = dateRange();
  $('f-date-help').textContent = !start ? '시작일을 선택하세요'
    : !end ? `${dayLabel(start)} · 종료일을 선택하세요`
      : start === end ? `${dayLabel(start)} 하루`
        : `${dayLabel(start)} ~ ${dayLabel(end)}`;
}

function fillDateRange(values) {
  const dates = [...new Set(values.filter(Boolean))].sort();
  DATE_MIN = dates[0] ?? '';
  DATE_MAX = dates.at(-1) ?? '';
  if (!DATE_MONTH || DATE_MONTH < DATE_MIN.slice(0, 7) || DATE_MONTH > DATE_MAX.slice(0, 7)) {
    DATE_MONTH = (DATE_RANGE.start || DATE_MIN).slice(0, 7);
  }
  updateDateRangeLabel();
  renderDateCalendar();
}

function selectCalendarDate(value) {
  DATE_RANGE = chooseDateRange(DATE_RANGE, value);
  updateDateRangeLabel();
  renderDateCalendar();
  filtered();
}

function changeDateMonth(delta) {
  DATE_MONTH = moveMonth(DATE_MONTH, delta);
  renderDateCalendar();
}

// 표와 지도가 같은 기준을 보도록 필터는 한 군데서만 겁니다.
function visibleTrips() {
  const platform = selectedValues('f-platform');
  const site = selectedValues('f-site'), region = selectedValues('f-region'), port = selectedValues('f-port');
  const species = selectedValues('f-species'), dates = dateRange(), session = selectedValues('f-session');
  const q = $('f-q').value.trim(), openOnly = $('f-open').checked;
  const favOnly = $('f-fav').checked, ratedOnly = $('f-rated').checked;
  const kst = kstParts();

  return DATA.trips.filter((t) =>
    (!favOnly || FAVS.has(favKey(t))) &&
    (!ratedOnly || rateOfTrip(t) > 0) &&
    (!platform.size || platformsOf(DATA.sites, t).some((p) => platform.has(p))) &&
    (!site.size || site.has(t.siteName) || (t.sources ?? []).some((x) => site.has(x.siteName))) &&
    hasSelection(region, regionOf(t.port)) && hasSelection(port, portOf(t)) &&
    (!species.size || speciesOf(t).some((s) => species.has(s))) && inDateRange(t.date, dates) &&
    hasSelection(session, sessionOf(t)) &&
    showTripByTime(t, kst) &&
    (!q || (t.boat ?? '').includes(q)) &&
    (!openOnly || t.status === 'open' || t.status === 'few'));
}

// ── 정렬 ──────────────────────────────────────────────────────────────────
// **날짜가 먼저입니다.** 표는 날짜로 끊어 보고(dayhead) 쪽도 날짜로 나누기 때문에,
// 잔여석순으로 통째로 섞으면 날짜 머리글이 줄마다 나오고 쪽 나누기가 무너집니다.
// 사람도 "언제 갈지"를 먼저 정하고 그 날 배를 고르므로, 고른 기준은 **하루 안에서** 겁니다.
//
// 값이 없는 행은 방향과 상관없이 뒤로 보냅니다. 승선료는 지금 99% 가 비어 있어서
// (node quality.js) 낮은순으로 올리면 빈 칸이 첫 화면을 다 덮습니다.
const SORTS = {
  default: null,
  'seats-desc': byValue((t) => t.seatsLeft, 'desc'),
  'seats-asc': byValue((t) => t.seatsLeft, 'asc'),
  'price-asc': byValue((t) => t.price, 'asc'),
  'rate-desc': byValue((t) => rateOfTrip(t) || null, 'desc'),
  'checked-desc': byValue(checkedAt, 'desc'),
};

// **빈자리가 있는 줄이 그 날의 위로 갑니다.** 날짜 다음, 고른 기준 앞입니다.
// 이 화면은 잡을 수 있는 자리를 찾는 화면이라, 마감·휴항된 배가 그 날 앞줄을 차지하면
// 하루를 통째로 볼 때(빈자리만을 끈 채) 위에서부터 헛것을 읽게 됩니다. 켜 두면 애초에
// 빈자리만 남으므로 이 규칙은 끄고 볼 때 드러납니다.
//
// 기준은 "빈자리만" 필터와 같은 open·few입니다 — 두 곳이 갈리면 체크를 껐다 켤 때
// 같은 줄이 위아래로 튑니다. 확인이 안 된 줄(unknown)은 올리지 않습니다. 자리가 있는지
// 모르는 배로 첫 화면을 덮느니 마감된 줄과 같이 뒤에서 수집 순서를 지키는 게 낫습니다
// (값이 없는 행을 뒤로 보내는 byValue와 같은 이유입니다).
const hasSeat = (t) => t.status === 'open' || t.status === 'few';
const byVacancy = (a, b) => (hasSeat(b) ? 1 : 0) - (hasSeat(a) ? 1 : 0);

/**
 * **내가 표시해 둔 줄이 그 날의 맨 위입니다 — 즐겨찾기가 먼저, 그다음 별점.**
 * 하루에 수백 줄이 나오는데 어느 배가 내가 눈여겨본 배인지는 표를 훑어야 알았습니다.
 * 즐겨찾기와 별점은 그걸 이미 적어둔 값이라, 자리 여부보다 앞에 둡니다 — 내가 찍어둔 배는
 * 오늘 마감이어도 "그 배가 오늘 떴는지"를 보고 싶습니다(빈자리만을 켜 두면 어차피 안 보입니다).
 * 안 매긴 배는 `byValue`의 규칙대로 뒤로 갑니다(0점이 아니라 값 없음으로 칩니다).
 * 별점이 낮은 배도 안 매긴 배보다는 위로 옵니다 — 내가 아는 배이고, 몇 점인지는 표에 보입니다.
 */
const byFav = (a, b) => (FAVS.has(favKey(b)) ? 1 : 0) - (FAVS.has(favKey(a)) ? 1 : 0);
const byRate = byValue((t) => rateOfTrip(t) || null, 'desc');

/**
 * 값이 없는 행은 **방향과 상관없이 뒤로** 보냅니다. 적은순이라고 모르는 값을 0으로 쳐서
 * 앞에 세우면, 잔여석을 못 읽은 배가 "자리 없는 배"로 보입니다.
 * 두 값이 다 없으면 0을 돌려줘 원래 순서(출항 시각·선사·배)에 맡깁니다.
 */
function byValue(pick, dir) {
  return (a, b) => {
    const x = finite(pick(a));
    const y = finite(pick(b));
    if (x === null && y === null) return 0;
    if (x === null) return 1;
    if (y === null) return -1;
    return dir === 'asc' ? x - y : y - x;
  };
}

function finite(value) {
  return Number.isFinite(value) ? value : null;
}

/** 그 출조의 값을 마지막으로 확인한 때. 합쳐진 줄은 가장 오래된 출처가 기준입니다. */
function checkedAt(t) {
  const times = (t.sources ?? [t]).map((s) => {
    const site = DATA.sites[s.siteId];
    return Date.parse(site?.ok ? site.at : site?.keptFrom);
  });
  const oldest = Math.min(...times);
  return Number.isFinite(oldest) ? oldest : null;
}

function sortTrips(trips, key = $('f-sort').value) {
  const by = SORTS[key];
  // data.json이 이미 날짜·출항시각·선사·배 순으로 정렬돼 옵니다(core/runner.js). 그 순서를
  // 동점자 규칙으로 그대로 쓰려면 안정 정렬이어야 합니다 — Array.sort는 안정입니다.
  // 기본순도 빈자리를 올려야 해서 여기서는 원본을 그대로 돌려주지 않습니다.
  // 하루 안의 차례: 즐겨찾기 → 별점 → 빈자리 → 고른 기준. 앞의 둘은 내가 적어둔 값이라
  // 어떤 정렬을 고르든 그대로 앞에 옵니다(정렬은 그 뒤를 정합니다).
  return [...trips].sort((a, b) =>
    (a.date ?? '').localeCompare(b.date ?? '')
    || byFav(a, b) || byRate(a, b) || byVacancy(a, b) || (by ? by(a, b) : 0));
}

// ── 쪽 나누기 ─────────────────────────────────────────────────────────────
// 필터를 걸어도 3주치가 한 화면에 수천 줄로 쏟아집니다. 날짜로 끊어 일주일씩 봅니다.
// 달력 주가 아니라 **출조가 있는 날 7개**입니다 — 배가 안 뜨는 날까지 세면 어떤 쪽은
// 텅 비고 어떤 쪽은 꽉 찹니다. 자르는 단위가 날짜라 한 날의 출조가 두 쪽에 갈리지 않습니다.
const DAYS_PER_PAGE = 7;
let PAGE = 0;

function paginate(trips) {
  const dates = [...new Set(trips.map((t) => t.date))].sort();
  const groups = [];
  for (let i = 0; i < dates.length; i += DAYS_PER_PAGE) groups.push(dates.slice(i, i + DAYS_PER_PAGE));
  // 필터를 좁히면 보고 있던 쪽이 사라질 수 있습니다. 마지막 쪽으로 당깁니다.
  PAGE = Math.min(Math.max(PAGE, 0), Math.max(groups.length - 1, 0));
  const week = new Set(groups[PAGE] ?? []);
  return { rows: trips.filter((t) => week.has(t.date)), groups, pages: Math.max(groups.length, 1) };
}
// ── 쪽 나누기 끝 ── (test/page.test.js가 이 표시까지를 떼어내 돌려봅니다)

function goPage(n) {
  PAGE = n;
  render();
  // 다음 주로 넘겼는데 지난 주의 끝을 보고 있으면 넘어간 걸 모릅니다.
  $('tablewrap').scrollIntoView({ block: 'start', behavior: 'smooth' });
}

function renderPager(view, total) {
  const label = (dates) => dates.length > 1
    ? `${dayLabel(dates[0])}~${dayLabel(dates[dates.length - 1])}`
    : dayLabel(dates[0]);

  for (const id of ['pager-top', 'pager-bottom']) {
    const box = $(id);
    box.textContent = '';
    // 한 쪽뿐이면 넘길 데가 없습니다. 지도를 보는 중에도 숨깁니다.
    box.hidden = view.pages <= 1 || !$('map').hidden;
    if (box.hidden) continue;

    const prev = document.createElement('button');
    prev.textContent = '← 이전 주';
    prev.disabled = PAGE === 0;
    prev.addEventListener('click', () => goPage(PAGE - 1));
    box.append(prev);

    view.groups.forEach((dates, n) => {
      const tab = document.createElement('button');
      tab.textContent = label(dates);
      tab.className = n === PAGE ? 'on' : '';
      if (n === PAGE) tab.setAttribute('aria-current', 'page');
      tab.addEventListener('click', () => goPage(n));
      box.append(tab);
    });

    const next = document.createElement('button');
    next.textContent = '다음 주 →';
    next.disabled = PAGE >= view.pages - 1;
    next.addEventListener('click', () => goPage(PAGE + 1));
    box.append(next);

    const count = document.createElement('span');
    count.className = 'count';
    count.textContent = `이 쪽 ${view.rows.length}건 · 조건에 맞는 ${total}건 (${PAGE + 1}/${view.pages}쪽)`;
    box.append(count);
  }
}

// 별·감시 버튼은 눌러도 표에 나오는 줄이 바뀌지 않습니다("즐겨찾기만"을 켠 때만 빼고).
// 버튼 하나 때문에 표를 통째로 다시 그리면 누를 때마다 130ms씩 멈춥니다
// (한 쪽이 행 1200개 · 노드 2만 개). 그래서 render()가 그리면서 버튼을 적어두고,
// 누를 때는 그 버튼만 고쳐 그립니다.
const ROW_BUTTONS = [];
// 칸의 성질도 순서가 아니라 이름으로 정합니다(위 cells와 같은 이유).
const NOWRAP_CELLS = new Set(['date', 'run', 'session', 'status']);
const NUM_CELLS = new Set(['seats', 'price']);
const COLLAPSED_DATES = new Set();

function paintStar(star, on) {
  star.className = 'star' + (on ? ' on' : '');
  star.textContent = on ? '★' : '☆';
  star.title = on ? '즐겨찾기에서 빼기' : '즐겨찾기에 넣기';
  star.setAttribute('aria-label', star.title);
}

function paintWatch(button, t) {
  const on = Boolean(watched(t));
  button.textContent = on ? '감시 해제' : '3분 감시';
  button.setAttribute('aria-pressed', String(on));
}

function paintDayToggle(button, date, collapsed) {
  button.textContent = collapsed ? '⌄' : '⌃';
  button.title = `${dayLabel(date)} 출조 ${collapsed ? '펼치기' : '접기'}`;
  button.setAttribute('aria-label', button.title);
  button.setAttribute('aria-expanded', String(!collapsed));
}

// 표와 지도를 한 번에 다시 그릴 때는 거른 결과를 넘겨받습니다. 안 넘기면 스스로 거릅니다
// (쪽 넘기기·지도 열기처럼 한쪽만 다시 그리는 자리).
function render(all = sortTrips(visibleTrips())) {
  const view = paginate(all);
  const rows = view.rows;
  renderPager(view, all.length);

  // 한 쪽이 3천 줄 · 4만 노드입니다. 살아 있는 표에 하나씩 붙이면 붙일 때마다 값을 치릅니다.
  // 조각에 다 모은 다음 한 번에 갈아 끼웁니다.
  const frag = document.createDocumentFragment();
  const tides = tidesByDate(rows);
  ROW_BUTTONS.length = 0;
  let prevDate = null;
  let currentDayRows = [];

  for (const t of rows) {
    if (t.date !== prevDate) {
      const dayRows = [];
      currentDayRows = dayRows;
      const day = document.createElement('tr');
      day.className = 'dayhead';
      const td = document.createElement('td');
      td.colSpan = 12;
      const tide = dayTideParts(t.date, tides.get(t.date));
      td.textContent = tide.label;
      if (tide.good) {
        const good = document.createElement('span');
        good.className = 'tidegood';
        good.textContent = '좋은 물때';
        td.append(good);
      }
      const hint = document.createElement('small');
      hint.textContent = '물때는 날짜별 공통 표기';
      td.append(hint);
      const toggle = document.createElement('button');
      toggle.className = 'daytoggle';
      toggle.type = 'button';
      paintDayToggle(toggle, t.date, COLLAPSED_DATES.has(t.date));
      toggle.addEventListener('click', () => {
        const collapsed = !COLLAPSED_DATES.has(t.date);
        if (collapsed) COLLAPSED_DATES.add(t.date);
        else COLLAPSED_DATES.delete(t.date);
        for (const row of dayRows) row.hidden = collapsed;
        paintDayToggle(toggle, t.date, collapsed);
      });
      td.append(toggle);
      day.append(td);
      frag.append(day);
      prevDate = t.date;
    }
    const tr = document.createElement('tr');
    tr.className = 'triprow';
    tr.hidden = COLLAPSED_DATES.has(t.date);
    currentDayRows.push(tr);
    const starCell = document.createElement('td');
    starCell.className = 'starcell';
    const boatMark = document.createElement('span');
    boatMark.className = 'boatmark';
    boatMark.textContent = (t.boat ?? '배').trim().slice(0, 1) || '배';
    boatMark.setAttribute('aria-hidden', 'true');
    const star = document.createElement('button');
    paintStar(star, FAVS.has(favKey(t)));
    star.addEventListener('click', () => toggleFav(t));
    starCell.append(boatMark, star);
    tr.append(starCell);

    let rateBtn = null;
    // **칸 순서가 곧 중요도입니다.** 운항은 36.5%, 승선료는 95%가 빈 칸이라(`node quality.js`)
    // 앞에 두면 첫 화면이 빈 칸으로 덮이고, 정작 고를 때 보는 값(선사·배·상태·잔여)이 오른쪽으로
    // 밀려 가로 스크롤 뒤에 숨습니다. 그래서 잘 차는 값부터 왼쪽에 둡니다.
    // **칸은 번호가 아니라 이름으로 다룹니다** — 번호로 두면 순서를 바꿀 때마다 아래 분기가
    // 조용히 다른 칸에 걸립니다. 순서를 바꾸면 위의 `<thead>`도 같이 고치세요(둘이 짝입니다).
    const cells = [
      ['date', dayLabel(t.date)],
      ['site', t.siteName ?? ''],
      ['boat', t.boat ?? ''],
      ['status', null],
      ['seats', seatsLabel(t)],
      ['port', t.port ?? ''],
      ['species', t.species ?? ''],
      ['price', won(t.price)],
      ['run', runLabel(t)],
      ['session', sessionLabel(t)],
    ];
    for (const [name, v] of cells) {
      const td = document.createElement('td');
      td.className = `cell-${name}`;
      if (name === 'status') {
        const b = document.createElement('span');
        b.className = 'badge ' + t.status;
        b.textContent = statusLabel(t);
        td.append(b);
      } else if (name === 'site') {
        // 여러 사이트에 같은 배가 올라와 있으면 둘 다 걸어줍니다. 어디서 잡든 상관없으니까요.
        const sources = tripSources(t);
        // 출처마다 잔여석이 다르면 그걸 보여줘야 합니다 — 합친 줄은 큰 쪽을 쓰기 때문에
        // (core/merge.js) 어느 사이트로 가야 그 자리가 있는지는 여기서만 알 수 있습니다.
        const seats = sources.map((src) => src.seatsLeft).filter(Number.isFinite);
        const split = sources.length > 1 && new Set(seats).size > 1;
        sources.forEach((src, n) => {
          if (n) td.append(' · ');
          if (!src.url) td.append(src.siteName ?? '');
          else {
            const a = document.createElement('a');
            a.href = src.url; a.target = '_blank'; a.rel = 'noopener noreferrer';
            a.textContent = src.siteName ?? '';
            if (Number.isFinite(src.seatsLeft)) a.title = `이 사이트 기준 잔여 ${src.seatsLeft}`;
            td.append(a);
          }
          td.append(platformChip(src.siteId));
          // 주소에 날짜를 넣을 수 있는 사이트는 그 날 예약 화면이 바로 열립니다. 아닌 곳은
          // 일정표 한 장으로 가서 날짜를 직접 찾아야 합니다 — 누르기 전에 알아야 합니다.
          if (!src.urlDated && src.url) {
            const hint = document.createElement('small');
            hint.className = 'srchint';
            hint.textContent = '일정표';
            hint.title = '이 사이트는 주소로 날짜를 지정할 수 없습니다. 열고 나서 날짜를 직접 고르세요.';
            td.append(hint);
          }
          if (split && Number.isFinite(src.seatsLeft)) {
            const seat = document.createElement('span');
            seat.className = 'srcseats';
            seat.textContent = `잔여 ${src.seatsLeft}`;
            seat.title = '출처마다 남은 자리가 다릅니다. 이 사이트 기준입니다.';
            td.append(seat);
          }
        });
        // 합친 줄이라도 번호는 하나입니다 — 이름·출항지·전화가 셋 다 같아야 합치니까요
        // (core/merge.js). 그래서 출처마다가 아니라 줄마다 한 번만 답니다.
        const phone = phoneLink(t.phone);
        if (phone) td.append(phone);
      } else if (name === 'boat') {
        // 별점은 **배**에 매긴 값이라 배 이름 옆에 답니다. 선사 칸에 달아뒀을 때는 매긴
        // 사람이 자기 별점을 못 찾았습니다 — 표에서 배와 선사는 다른 칸이고, 별을 준
        // 이름은 배 이름입니다. 출처가 아니라 배의 평가이므로 합쳐진 줄에도 한 번만 붙습니다.
        const name = document.createElement('span');
        name.className = 'boatname';
        name.textContent = v;
        td.append(name);
        rateBtn = document.createElement('button');
        rateBtn.type = 'button';
        paintRate(rateBtn, rateOfTrip(t));
        rateBtn.addEventListener('click', (e) => { e.stopPropagation(); openRatePop(rateBtn, t); });
        td.append(rateBtn);
      } else {
        td.textContent = v;
      }
      if (name === 'run') {
        if (!t.departAt) td.title = '예약 페이지에 출항 시각이 없습니다. 선사에 확인해 주세요.';
        if (t.timeSource === 'notice') {
          const note = document.createElement('small');
          note.className = 'freshness'; note.textContent = '선사 공지 기준';
          td.append(note);
          td.title = '개별 예약표 대신 선사가 공지한 해당 시즌 출항 시각입니다.';
        }
      }
      if (name === 'seats' && !Number.isFinite(t.seatsLeft) && seatsLabel(t)) {
        td.title = '예약 페이지에 잔여 좌석 수가 없습니다. 선사에 확인해 주세요.';
      }
      // 날짜·운항·구분·상태는 줄이 갈리면 읽기 나빠집니다. 폭은 긴 이름 칸에서 법니다.
      if (NOWRAP_CELLS.has(name)) td.classList.add('nowrap');
      if (NUM_CELLS.has(name)) td.classList.add('num');
      if (name === 'seats') {
        const age = freshness(t), hint = document.createElement('small');
        hint.className = 'freshness' + (age.failed ? ' failed' : age.stale ? ' stale' : '');
        hint.textContent = age.text;
        td.append(hint);
      }
      tr.append(td);
    }
    const watchCell = document.createElement('td');
    watchCell.className = 'watchcell';
    const actions = document.createElement('div');
    actions.className = 'watchactions';
    let watch = null;
    if (MONITOR) {
      watch = document.createElement('button');
      watch.className = 'watch';
      paintWatch(watch, t);
      watch.onclick = () => toggleWatch(t, watch);
      actions.append(watch);
    }
    if (ADMIN_API) {
      const sources = [...new Map(tripSources(t).map((source) => [source.siteId, source])).values()];
      let chosen = sources[0]?.siteId;
      if (sources.length > 1) {
        const select = document.createElement('select');
        select.className = 'source-select';
        select.setAttribute('aria-label', '최신화할 선사');
        for (const source of sources) {
          const option = document.createElement('option');
          option.value = source.siteId;
          option.textContent = source.siteName ?? source.siteId;
          select.append(option);
        }
        select.onchange = () => { chosen = select.value; };
        actions.append(select);
      }
      const update = document.createElement('button');
      update.className = 'watch refresh';
      update.textContent = '선사 최신화';
      update.title = '이 선사만 지금 다시 수집합니다';
      update.onclick = () => refreshSite(chosen, update);
      actions.append(update);
    }
    if (actions.childNodes.length) watchCell.append(actions);
    else watchCell.textContent = '로컬 전용';
    tr.append(watchCell);
    frag.append(tr);
    ROW_BUTTONS.push({ trip: t, star, watch, rate: rateBtn });
  }

  $('rows').replaceChildren(frag);

  $('empty').hidden = rows.length > 0;
  $('empty').textContent = emptyMessage();
  $('f-fav-label').textContent = favLabel();
  $('f-rated-label').textContent = ratedLabel();
}

function renderStatus() {
  const box = $('status');
  box.textContent = '';
  for (const [id, s] of Object.entries(DATA.sites)) {
    const div = document.createElement('div');
    if (!s.ok) div.className = s.skipped ? 'held' : 'fail';
    else if (s.localError) div.className = 'held';
    const when = s.at ? new Date(s.at).toLocaleString('ko-KR') : '';
    const kind = s.platform ? ` [${s.platform}]` : '';
    // 받아온 결과가 더 새것이라 그걸 싣고 있는 선사입니다(core/monitor.js의 stalled).
    // 숫자는 최신이지만 이 PC의 수집은 깨져 있어서 3분 감시가 안 돕니다 — 그걸 적습니다.
    const local = s.ok && s.localError ? ` · 이 PC 수집 실패(${s.localError})` : '';
    div.textContent = s.ok
      ? `✓ ${s.name ?? id}${kind} — ${s.count}건 · ${when}${local}`
      : s.skipped
        ? `△ ${s.name ?? id}${kind} — 갱신 보류(${s.error}) · 직전 ${s.count}건 유지`
        : `✗ ${s.name ?? id}${kind} — 갱신 실패(${s.error}) · 직전 ${s.count}건 유지`;
    box.append(div);
  }
}

function loadData() { return fetch('data.json?t=' + Date.now(), { cache: 'no-store' })
  .then((r) => r.json())
  .then((d) => {
    DATA = d;
    RATES = loadRates();   // 관리 화면에서 매긴 별점이 다음 갱신 때 따라옵니다
    clearRateCache();
    const failed = Object.values(d.sites).filter((s) => !s.ok && !s.skipped).length;
    const held = Object.values(d.sites).filter((s) => !s.ok && s.skipped).length;
    $('meta').textContent =
      `출조 ${d.trips.length}건 · 갱신 ${d.generatedAt ? new Date(d.generatedAt).toLocaleString('ko-KR') : '-'}` +
      (failed ? ` · 갱신 실패 ${failed}곳` : '') + (held ? ` · 보류 ${held}곳` : '');
    migrateFavs(d.trips);
    fillOptions($('f-platform'), d.trips.flatMap((t) => platformsOf(d.sites, t)));
    fillOptions($('f-site'), d.trips.map((t) => t.siteName));
    fillOptions($('f-region'), d.trips.map((t) => regionOf(t.port)));
    fillOptions($('f-port'), d.trips.map(portOf));
    fillOptions($('f-species'), d.trips.flatMap(speciesOf), ['갑오징어', '주꾸미']);
    fillOptions($('f-session'), d.trips.map(sessionOf));
    fillDateRange(d.trips.map((t) => t.date));
    renderStatus();
    refresh();
  })
  .catch((e) => { $('meta').textContent = 'data.json을 못 읽었습니다: ' + e.message; }); }

// 감시 서버는 내 PC일 수도, 상시 서버일 수도 있습니다(DEPLOY.md). 주소로 짐작하지 않고
// 같은 곳에 물어봅니다. 정적 호스팅(GitHub Pages)이면 그 길이 아예 없어서 404·403이
// 돌아오는데, 그건 고장이 아니라 **읽기 전용 화면**이라는 뜻이라 다시 묻지 않습니다.
let WATCH_API = true;
let ADMIN_API = false;
let ADMIN_CHECKED = false;

async function probeAdmin() {
  if (ADMIN_CHECKED) return;
  ADMIN_CHECKED = true;
  try {
    const r = await fetch('/api/sites', { headers: { 'X-Admin': '1' } });
    ADMIN_API = r.ok;
  } catch { ADMIN_API = false; }
}

async function reload() {
  try {
    await probeAdmin();
    if (WATCH_API) {
      const r = await fetch('/api/monitor', { headers: watchHeaders() });
      if (r.status === 404 || r.status === 403) {
        WATCH_API = false;
        MONITOR = null;
        $('watch-panel').hidden = true;
        $('alert-panel').hidden = true;
      } else if (!r.ok) {
        throw new Error('감시 서버 연결 실패');
      } else {
        MONITOR = await r.json();
        monitorMessage();
        await loadAlerts();
      }
    }
  } catch {
    // 있던 서버가 죽은 경우입니다 — 이건 알려줘야 합니다.
    MONITOR = null;
    $('watch-panel').hidden = true;
    $('alert-panel').hidden = true;
    $('monitor-status').textContent = '감시 서버에 연결할 수 없습니다. 서버 실행 상태를 확인하세요.';
  }
  await loadData();
}
reload();
// 응답이 늦어져도 화면 갱신 요청을 겹쳐 보내지 않습니다.
async function pollData() { await reload(); setTimeout(pollData, 30000); }
setTimeout(pollData, 30000);

// 거르는 일은 한 번만 합니다. 표와 지도가 각자 거르면 같은 1만 건을 두 번 훑습니다.
const refresh = () => { const trips = sortTrips(visibleTrips()); render(trips); drawMap(trips); };
// 관리창을 다른 탭에 열어 별점을 바꾸면 localStorage는 즉시 바뀌지만 이 탭의 RATES는
// 옛 객체를 들고 있습니다. 다음 30초 수집 갱신까지 기다리지 않고 바로 다시 그립니다.
window.addEventListener('storage', (event) => {
  if (event.key !== RATE_KEY) return;
  RATES = loadRates();
  clearRateCache();
  refresh();
});
// 필터를 바꾸면 보던 쪽 번호는 의미가 없습니다. 첫 주부터 다시 봅니다.
const filtered = () => { PAGE = 0; refresh(); };
for (const id of ['f-open', 'f-fav', 'f-rated']) $(id).addEventListener('change', filtered);
$('f-date-prev').addEventListener('click', () => changeDateMonth(-1));
$('f-date-next').addEventListener('click', () => changeDateMonth(1));
$('f-date-clear').addEventListener('click', () => {
  DATE_RANGE = { start: null, end: null };
  updateDateRangeLabel();
  renderDateCalendar();
  filtered();
});
// 정렬은 보이는 날짜를 바꾸지 않으므로 보던 쪽에 그대로 있습니다(필터와 다른 점입니다).
$('f-sort').addEventListener('change', () => refresh());
// 배 이름 검색은 한 글자마다 걸지 않습니다. 손이 멈춘 뒤에 한 번만 겁니다 —
// 안 그러면 "무적호"를 치는 동안 표를 예닐곱 번 다시 그립니다.
// 한글은 조합 중에도 input이 뜹니다(ㅁ→무→뭇→무적). 조합이 끝나기 전에는 그리지 않습니다.
const SEARCH_DELAY = 150;
let searchTimer = null;
let composing = false;
function queueSearch() {
  clearTimeout(searchTimer);
  searchTimer = setTimeout(() => { if (!composing) filtered(); }, SEARCH_DELAY);
}
$('f-q').addEventListener('input', queueSearch);
$('f-q').addEventListener('compositionstart', () => { composing = true; });
$('f-q').addEventListener('compositionend', () => { composing = false; queueSearch(); });

// <details>는 한 번 열면 스스로 안 닫힙니다. 여섯 개를 차례로 누르면 메뉴가 겹겹이
// 열린 채 표를 가립니다. 바깥을 누르면 닫습니다 — 다른 메뉴의 summary를 누른 것도
// "바깥"이라 자연히 하나만 열립니다. 안쪽(체크박스·라벨·스크롤바)은 그대로 둡니다.
function closeMenusOutside(target) {
  for (const menu of document.querySelectorAll('details.multi[open]')) {
    if (!menu.contains(target)) menu.open = false;
  }
}
document.addEventListener('click', (e) => { closeMenusOutside(e.target); closeRatePopOutside(e.target); });
document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeMenusOutside(null); closeRatePop(); } });

// ── 지도 ──────────────────────────────────────────────────────────────────
// 항구 좌표는 data.json의 ports로 들어옵니다(sites/ports.json에서 옵니다).
// 마커는 "지금 필터에 걸린" 출조 기준이라, 어종·날짜를 좁히면 지도도 같이 좁혀집니다.
// 마커를 누르면 같은 시·군·구 지역의 항구를 한 번에 봅니다.
let map = null;
let markers = null;

const css = (name) => getComputedStyle(document.body).getPropertyValue(name).trim() || '#888';

function ensureMap() {
  if (map || !window.L) return;
  map = L.map('map', { scrollWheelZoom: true }).setView([36.9, 126.6], 8);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 17,
    attribution: '&copy; <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>',
  }).addTo(map);
  markers = L.layerGroup().addTo(map);
}

function drawMap(trips = visibleTrips()) {
  if (!map || !markers) return;
  markers.clearLayers();

  const byPort = new Map();
  for (const t of trips) {
    if (!t.port || !DATA.ports?.[t.port]) continue;
    const cur = byPort.get(t.port) ?? { trips: 0, open: 0 };
    cur.trips += 1;
    if (t.status === 'open' || t.status === 'few') cur.open += 1;
    byPort.set(t.port, cur);
  }

  const bounds = [];
  for (const [port, count] of byPort) {
    const { lat, lng, approx } = DATA.ports[port];
    const color = count.open ? css('--open') : css('--closed');
    bounds.push([lat, lng]);
    L.circleMarker([lat, lng], {
      radius: Math.min(9 + count.open * 1.6, 26),
      color, fillColor: color, fillOpacity: 0.35, weight: 2,
    })
      .bindTooltip(`${port}${approx ? ' (대략 위치)' : ''}<br>출조 ${count.trips}건 · 빈자리 ${count.open}건`)
      .on('click', () => {
        setOnlyFilterValue('f-region', regionOf(port));
        setOnlyFilterValue('f-port', null);
        filtered();
      })
      .addTo(markers);
  }

  // 지도에 못 찍은 배를 말없이 빼면 "왜 이 배가 안 보이지"가 됩니다. 몇 건이 왜 빠졌는지 적습니다.
  const hidden = trips.filter((t) => !t.port || !DATA.ports?.[t.port]);
  const noPort = hidden.filter((t) => !t.port).length;
  const noCoord = new Set(hidden.filter((t) => t.port).map((t) => t.port));
  $('maphint').textContent = Object.keys(DATA.ports ?? {}).length
    ? `항구 ${byPort.size}곳 · 마커를 누르면 같은 지역 항구만 봅니다. 지도는 주 단위로 나누지 않고 필터에 걸린 전체를 보여줍니다.`
      + ' 좌표는 대략값이라 실제 선착장과 다를 수 있습니다.'
      + (noPort ? ` · 항구를 모르는 출조 ${noPort}건은 지도에 없습니다(시스템 관리에서 항구를 적으면 나옵니다).` : '')
      + (noCoord.size ? ` · 좌표 없는 항구 ${noCoord.size}곳은 sites/ports.json에 넣어야 찍힙니다.` : '')
    : '항구 좌표가 없습니다 — sites/ports.json을 채우세요.';
  if (bounds.length) map.fitBounds(bounds, { padding: [40, 40], maxZoom: 10 });
}

function switchView(toMap) {
  $('view-map').classList.toggle('on', toMap);
  $('view-table').classList.toggle('on', !toMap);
  $('map').hidden = !toMap;
  $('maphint').hidden = !toMap;
  $('tablewrap').hidden = toMap;
  for (const id of ['pager-top', 'pager-bottom']) $(id).hidden = toMap || $(id).textContent === '';
  if (!toMap) return;
  ensureMap();
  // 숨겨진 채로 만들어진 지도는 자기 크기를 모릅니다.
  setTimeout(() => { map?.invalidateSize(); drawMap(); }, 0);
}

$('view-map').addEventListener('click', () => switchView(true));
$('view-table').addEventListener('click', () => switchView(false));

// 왼쪽 탭바 접기. 표가 넓어 오른쪽 칸이 잘릴 때 172px을 돌려받는 길입니다.
// 접은 상태는 즐겨찾기·별점과 같은 급의 개인 기록이라 브라우저에만 둡니다. 열쇠가 하나라
// 현황판에서 접으면 시스템 관리도 접혀 있습니다 — 화면마다 폭이 달라지면 오갈 때마다 놀랍니다.
const NAV_FOLD_KEY = 'fishing:nav-fold';

function paintNavFold(fold) {
  document.body.dataset.nav = fold ? 'fold' : 'open';
  const label = fold ? '탭바 펼치기' : '탭바 접기';
  $('navfold').setAttribute('aria-expanded', String(!fold));
  $('navfold').setAttribute('aria-label', label);
  $('navfold').title = label;
}

try { paintNavFold(localStorage.getItem(NAV_FOLD_KEY) === '1'); } catch { paintNavFold(false); }
$('navfold').addEventListener('click', () => {
  const fold = document.body.dataset.nav !== 'fold';
  paintNavFold(fold);
  try { localStorage.setItem(NAV_FOLD_KEY, fold ? '1' : '0'); } catch { /* 저장이 막혀도 이번 세션은 됩니다 */ }
});

</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/leaflet/1.9.4/leaflet.min.js" defer></script>
