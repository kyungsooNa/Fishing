<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>시스템 관리 · 낚시 출조 예약 현황판</title>
<style>
  :root {
    color-scheme: light dark;
    --bg: #f7f7f5; --card: #fff; --fg: #1c1b19; --muted: #6b6862; --line: #e3e1dc;
    --open: #1a7f4b; --few: #b06a00; --closed: #8b8781; --off: #a03030;
    --accent: #245a8d;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #17171a; --card: #201f23; --fg: #e9e7e2; --muted: #9a968e; --line: #33323a;
      --open: #4cc487; --few: #e0a33c; --closed: #7d7a74; --off: #e07070; --accent: #7fb0e0;
    }
  }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg);
         font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif; }
  .wrap { max-width: 1400px; margin: 0 auto; padding: 20px 16px 60px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 18px; }
  a { color: var(--accent); }
  .banner { padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px;
            background: var(--card); font-size: 13px; margin-bottom: 14px; }
  .banner.warn { border-color: var(--few); color: var(--few); }
  .actions { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 14px; }
  button { padding: 7px 14px; border: 1px solid var(--line); border-radius: 7px;
           background: var(--card); color: var(--fg); font: inherit; font-size: 14px; cursor: pointer; }
  button:disabled { color: var(--muted); cursor: not-allowed; }
  button.primary { border-color: var(--accent); color: var(--accent); font-weight: 600; }
  button.danger { border-color: var(--off); color: var(--off); }
  .tablewrap { overflow-x: auto; background: var(--card); border: 1px solid var(--line); border-radius: 10px; }
  table { border-collapse: collapse; width: 100%; min-width: 1000px; table-layout: fixed; }
  th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--line); vertical-align: middle; }
  th { font-size: 12px; color: var(--muted); font-weight: 600; white-space: nowrap; }
  /* 칸 폭을 못박아 둡니다. 안 그러면 표기·항구가 눌려서 글자가 잘립니다. */
  th:nth-child(1), td:nth-child(1) { width: 48px; }
  th:nth-child(2), td:nth-child(2) { width: 116px; }
  th:nth-child(3), td:nth-child(3) { width: 200px; }
  th:nth-child(4), td:nth-child(4) { width: 76px; }
  th:nth-child(5), td:nth-child(5) { width: 190px; }
  th:nth-child(6), td:nth-child(6) { width: 150px; }
  th:nth-child(7), td:nth-child(7) { width: 220px; }
  tbody tr:last-child td { border-bottom: 0; }
  tr.off td { opacity: 0.55; }
  td.id { font-family: ui-monospace, SFMono-Regular, Menlo, monospace; font-size: 13px; white-space: nowrap; }
  td input[type=text] { width: 100%; min-width: 0; padding: 5px 7px; border: 1px solid transparent;
                        border-radius: 6px; background: transparent; color: var(--fg); font: inherit; font-size: 14px; }
  td input[type=text]:hover { border-color: var(--line); }
  td input[type=text]:focus { border-color: var(--accent); outline: none; background: var(--bg); }
  tr.dirty { background: color-mix(in srgb, var(--few) 12%, transparent); }
  .kind { font-size: 12px; color: var(--muted); white-space: nowrap; }
  .ok { color: var(--open); } .fail { color: var(--off); } .muted { color: var(--muted); }
  td.url { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  /* 실패 사유가 길어서 한 줄로 두면 표가 옆으로 삐져나갑니다. 남는 폭 안에서 접습니다. */
  .last { font-size: 13px; }
  .log { margin-top: 14px; background: var(--card); border: 1px solid var(--line); border-radius: 10px;
         padding: 12px; font: 12px/1.55 ui-monospace, SFMono-Regular, Menlo, monospace;
         white-space: pre-wrap; max-height: 320px; overflow-y: auto; }
  .log:empty { display: none; }
  .toast { margin-left: auto; font-size: 13px; color: var(--muted); }
  h2.sec { font-size: 16px; margin: 30px 0 4px; }
  .empty { padding: 22px; text-align: center; color: var(--muted); font-size: 14px; }
  /* 즐겨찾기 표는 칸이 넷뿐이라 사이트 표의 폭 고정을 물려받으면 안 됩니다. */
  table.favtable { table-layout: auto; min-width: 520px; }
  table.favtable th, table.favtable td { width: auto; }
  button.small { padding: 4px 10px; font-size: 13px; }
  /* 등록 출처 배지. 자동이 압도적으로 많아서 눈에 덜 띄는 쪽을 자동으로 씁니다. */
  .tag { display: inline-block; padding: 1px 7px; border-radius: 999px; font-size: 12px;
         border: 1px solid var(--line); color: var(--muted); white-space: nowrap; }
  .tag.manual { border-color: #9aa7b8; color: #46546a; font-weight: 600; }
  .pager { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; margin: 10px 0; font-size: 13px; }
  .pager select { padding: 3px 6px; }
  .pager .count { color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <h1>시스템 관리</h1>
  <div class="sub"><a href="index.html">← 현황판으로</a> · <span id="meta">불러오는 중…</span></div>

  <div class="banner" id="banner" hidden></div>

  <div class="actions">
    <button id="save" class="primary" disabled>변경 저장</button>
    <button id="update">최신 코드 받기</button>
    <button id="collect">수집 다시 실행</button>
    <button id="restart">앱 재실행</button>
    <button id="quit" class="danger">서버 종료</button>
    <span class="toast" id="toast"></span>
  </div>

  <!-- 사이트가 300곳 가까이 됩니다. 한 화면에 다 그리면 못 씁니다. -->
  <div class="pager">
    <label>등록
      <select id="filter">
        <option value="all">전체</option>
        <option value="manual">수동</option>
        <option value="discover">자동</option>
      </select>
    </label>
    <label>쪽당
      <select id="pagesize">
        <option value="25">25곳</option>
        <option value="50" selected>50곳</option>
        <option value="100">100곳</option>
        <option value="0">전체</option>
      </select>
    </label>
    <button id="prev" class="small">← 이전</button>
    <button id="next" class="small">다음 →</button>
    <span class="count" id="pageinfo"></span>
  </div>

  <div class="tablewrap">
    <table>
      <thead><tr>
        <th>켜짐</th><th>id</th><th>선사 표기</th><th>계열</th><th>등록</th><th>항구</th><th>전화</th>
        <th>주소</th><th>최근 수집</th>
      </tr></thead>
      <tbody id="rows"></tbody>
    </table>
    <div class="empty" id="rowsempty" hidden>이 조건에 맞는 사이트가 없습니다.</div>
  </div>

  <h2 class="sec">즐겨찾기</h2>
  <div class="sub" id="favmeta">불러오는 중…</div>
  <div class="tablewrap">
    <table class="favtable">
      <thead><tr><th>배</th><th>항구</th><th>상태</th><th></th></tr></thead>
      <tbody id="favrows"></tbody>
    </table>
    <div class="empty" id="favempty" hidden>즐겨찾기가 없습니다. 현황판에서 배 왼쪽 ☆ 를 누르면 여기 담깁니다.</div>
  </div>
  <div class="actions" style="margin-top: 10px;">
    <button id="favclear" class="danger">전체 비우기</button>
  </div>

  <div class="log" id="log"></div>
</div>

<script>
const $ = (id) => document.getElementById(id);
const HEAD = { 'X-Admin': '1' };

let LOCAL = false;      // 로컬 서버(/api/*)가 있으면 true. GitHub Pages에서는 false
let RESTARTABLE = false; // run.bat처럼 종료 코드를 보고 다시 띄워주는 실행기로 켰는지
let SITES = [];         // registry의 사이트 목록 (정적 모드에서는 data.json으로 흉내)
let PAGE = 0;           // 0부터. 목록이 바뀌면 범위를 벗어날 수 있어 그릴 때 다시 맞춥니다
let PAGE_SIZE = 50;     // 0이면 전체
let FILTER = 'all';     // all | manual | discover
let STATUS = {};        // 사이트별 마지막 수집 결과
const DIRTY = new Map(); // id -> 바뀐 값들

const api = (path, opt = {}) => fetch(path, { ...opt, headers: { ...HEAD, ...(opt.headers ?? {}) } });

function toast(text) {
  $('toast').textContent = text;
  if (text) setTimeout(() => { if ($('toast').textContent === text) $('toast').textContent = ''; }, 4000);
}

function when(at) {
  return at ? new Date(at).toLocaleString('ko-KR') : '';
}

function markDirty(id, key, value) {
  const bag = DIRTY.get(id) ?? {};
  bag[key] = value;
  DIRTY.set(id, bag);
  document.querySelector(`tr[data-id="${id}"]`)?.classList.add('dirty');
  $('save').disabled = DIRTY.size === 0;
  $('save').textContent = DIRTY.size ? `변경 저장 (${DIRTY.size}곳)` : '변경 저장';
}

function textCell(site, key) {
  const td = document.createElement('td');
  if (!LOCAL) {
    td.textContent = site[key] ?? '';
    if (!site[key]) td.className = 'muted';
    return td;
  }
  const input = document.createElement('input');
  input.type = 'text';
  input.value = site[key] ?? '';
  input.placeholder = '-';
  input.addEventListener('input', () => markDirty(site.id, key, input.value.trim()));
  td.append(input);
  return td;
}

/** 화면에 보일 목록. 등록 출처로 거릅니다. */
function visibleSites() {
  if (FILTER === 'manual') return SITES.filter((s) => !s.addedBy);
  if (FILTER === 'discover') return SITES.filter((s) => s.addedBy);
  return SITES;
}

function addedTag(site) {
  const td = document.createElement('td');
  const tag = document.createElement('span');
  const auto = Boolean(site.addedBy);
  tag.className = auto ? 'tag' : 'tag manual';
  tag.textContent = auto ? '자동' : '수동';
  // 어느 소스로 찾았는지는 note에 적혀 있습니다. 표에 다 펴면 넘치니 툴팁으로만.
  tag.title = auto ? `discover가 등록: ${site.note ?? ''}`.trim() : '사람이 registry에 직접 적었습니다';
  td.append(tag);
  return td;
}

function render() {
  const box = $('rows');
  box.textContent = '';

  const list = visibleSites();
  const size = PAGE_SIZE || list.length || 1;
  const pages = Math.max(1, Math.ceil(list.length / size));
  if (PAGE >= pages) PAGE = pages - 1;      // 필터를 좁히면 지금 쪽이 사라질 수 있습니다
  if (PAGE < 0) PAGE = 0;
  const from = PAGE * size;
  const page = list.slice(from, from + size);

  $('rowsempty').hidden = list.length > 0;
  $('pageinfo').textContent = list.length
    ? `${from + 1}–${from + page.length} / ${list.length}곳 (${PAGE + 1}/${pages}쪽)`
    : '0곳';
  $('prev').disabled = PAGE === 0;
  $('next').disabled = PAGE >= pages - 1;

  for (const site of page) {
    const st = STATUS[site.id];
    const tr = document.createElement('tr');
    tr.dataset.id = site.id;
    const on = site.enabled !== false;
    if (!on) tr.classList.add('off');

    const tdOn = document.createElement('td');
    const cb = document.createElement('input');
    cb.type = 'checkbox';
    cb.checked = on;
    cb.disabled = !LOCAL;
    cb.addEventListener('change', () => {
      markDirty(site.id, 'enabled', cb.checked);
      tr.classList.toggle('off', !cb.checked);
    });
    tdOn.append(cb);

    const tdId = document.createElement('td');
    tdId.className = 'id';
    tdId.textContent = site.id;

    const tdKind = document.createElement('td');
    tdKind.className = 'kind';
    tdKind.textContent = site.platformLabel ?? site.adapter ?? '';

    const tdUrl = document.createElement('td');
    tdUrl.className = 'url';
    if (site.url) {
      const a = document.createElement('a');
      a.href = site.url;
      a.target = '_blank';
      a.rel = 'noopener';
      a.textContent = site.url.replace(/^https?:\/\//, '');
      a.title = site.url;
      tdUrl.append(a);
    }

    const tdLast = document.createElement('td');
    tdLast.className = 'last';
    if (!st) tdLast.innerHTML = '<span class="muted">수집 기록 없음</span>';
    else if (st.ok) tdLast.innerHTML = `<span class="ok">✓ ${st.count}건</span> <span class="muted">${when(st.at)}</span>`;
    else tdLast.innerHTML = `<span class="fail">✗ ${st.error ?? '실패'}</span> <span class="muted">직전 ${st.count ?? 0}건 유지</span>`;

    tr.append(tdOn, tdId, textCell(site, 'name'), tdKind, addedTag(site), textCell(site, 'port'),
              textCell(site, 'phone'), tdUrl, tdLast);
    // 저장 전에 다른 쪽으로 넘어갔다 돌아와도 고친 표시가 남아 있어야 합니다.
    if (DIRTY.has(site.id)) tr.classList.add('dirty');
    box.append(tr);
  }
}

function bindPager() {
  $('filter').addEventListener('change', () => { FILTER = $('filter').value; PAGE = 0; render(); });
  $('pagesize').addEventListener('change', () => { PAGE_SIZE = Number($('pagesize').value); PAGE = 0; render(); });
  $('prev').addEventListener('click', () => { PAGE -= 1; render(); });
  $('next').addEventListener('click', () => { PAGE += 1; render(); });
}

async function save() {
  $('save').disabled = true;
  const failed = [];
  for (const [id, body] of DIRTY) {
    try {
      const res = await api('api/sites/' + id, {
        method: 'PATCH',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify(body),
      });
      if (!res.ok) failed.push(`${id}: ${(await res.json()).error ?? res.status}`);
    } catch (err) {
      failed.push(`${id}: ${err.message}`);
    }
  }
  DIRTY.clear();
  $('save').textContent = '변경 저장';
  document.querySelectorAll('tr.dirty').forEach((tr) => tr.classList.remove('dirty'));
  toast(failed.length ? '일부 실패: ' + failed.join(', ') : '저장했습니다');
  await load();
}

let polling = null;
async function pollCollect() {
  const job = await api('api/collect').then((r) => r.json());
  $('log').textContent = job.log.join('\n');
  $('log').scrollTop = $('log').scrollHeight;
  if (job.running) return;
  clearInterval(polling);
  polling = null;
  $('collect').disabled = false;
  $('collect').textContent = '수집 다시 실행';
  toast(job.code === 0 ? '수집이 끝났습니다' : `수집이 코드 ${job.code}로 끝났습니다`);
  await load();
}

async function collect() {
  $('collect').disabled = true;
  $('collect').textContent = '수집 중…';
  const res = await api('api/collect', { method: 'POST' });
  if (!res.ok) {
    toast((await res.json()).error ?? '시작하지 못했습니다');
    $('collect').disabled = false;
    $('collect').textContent = '수집 다시 실행';
    return;
  }
  polling = setInterval(pollCollect, 1500);
}

async function update() {
  $('update').disabled = true;
  const label = $('update').textContent;
  $('update').textContent = '받는 중…';
  let d;
  try {
    d = await api('api/update', { method: 'POST' }).then((r) => r.json());
  } catch (err) {
    toast('최신화 실패: ' + err.message);
    $('update').disabled = false;
    $('update').textContent = label;
    return;
  }
  $('log').textContent = d.log || '(출력 없음)';

  if (!d.ok) {
    if (d.error) {
      $('log').textContent =
        `원인: ${d.error.message}\n해결: ${d.error.hint}\n\n${$('log').textContent}`;
    }
    toast(d.error?.message ?? 'git pull이 실패했습니다');
  } else if (!d.changed) {
    toast('이미 최신입니다');
  } else if (d.willRestart) {
    toast('새 코드로 다시 띄우는 중…');
    return waitForRestart();
  } else {
    toast('받았습니다. 반영하려면 서버를 다시 띄우세요');
  }
  $('update').disabled = false;
  $('update').textContent = label;
  await load();
}

async function restart() {
  if (DIRTY.size && !confirm('저장하지 않은 변경이 있습니다. 그래도 재실행할까요?')) return;
  $('restart').disabled = true;
  $('restart').textContent = '재실행 중…';
  let d;
  try {
    const res = await api('api/restart', { method: 'POST' });
    d = await res.json();
    if (!res.ok) throw new Error(d.error ?? '재실행할 수 없습니다');
  } catch (err) {
    toast('재실행 실패: ' + err.message);
    $('restart').disabled = !RESTARTABLE;
    $('restart').textContent = '앱 재실행';
    return;
  }
  if (d.willRestart) {
    toast('앱을 다시 띄우는 중…');
    return waitForRestart();
  }
}

// 서버가 내려갔다 같은 포트로 다시 올라옵니다. 응답이 돌아오면 화면을 새로 읽습니다.
async function waitForRestart() {
  for (let i = 0; i < 60; i++) {
    await new Promise((r) => setTimeout(r, 500));
    try {
      const res = await fetch('data.json?t=' + Date.now(), { cache: 'no-store' });
      if (res.ok) return location.reload();
    } catch { /* 아직 안 올라왔습니다 */ }
  }
  $('log').textContent += '\n서버가 다시 올라오지 않았습니다. run.bat 창을 확인하세요.';
}

async function quit() {
  if (!confirm('서버를 종료합니다. 화면도 같이 닫힙니다. 계속할까요?')) return;
  await api('api/shutdown', { method: 'POST' }).catch(() => {});
  document.body.innerHTML =
    '<div class="wrap"><h1>서버를 종료했습니다</h1>' +
    '<div class="sub">이 탭은 닫으셔도 됩니다. 다시 켜려면 run.bat을 실행하세요.</div></div>';
}

// 현황판(index.html)과 똑같은 형식이어야 합니다. 같은 오리진이라 같은 localStorage를 봅니다.
const FAV_KEY = 'fishing:favorites';
const favKey = (t) => `${t.boat ?? ''}|${t.port ?? ''}`;

function loadFavs() {
  try { return JSON.parse(localStorage.getItem(FAV_KEY) ?? '[]'); } catch { return []; }
}
function saveFavs(list) {
  try { localStorage.setItem(FAV_KEY, JSON.stringify(list)); return true; } catch { return false; }
}

function renderFavs(trips) {
  const favs = loadFavs();
  const live = new Set(trips.map(favKey));
  const box = $('favrows');
  box.textContent = '';
  $('favempty').hidden = favs.length > 0;
  $('favclear').disabled = favs.length === 0;

  const stale = favs.filter((k) => !live.has(k)).length;
  $('favmeta').textContent = favs.length
    ? `${favs.length}개 · 이 브라우저에만 저장됩니다` + (stale ? ` · 지금 목록에 없는 것 ${stale}개` : '')
    : '이 브라우저에만 저장됩니다. 기기를 바꾸면 따라오지 않습니다.';

  for (const key of favs) {
    const [boat, port] = [key.slice(0, key.indexOf('|')), key.slice(key.indexOf('|') + 1)];
    const tr = document.createElement('tr');
    const tdBoat = document.createElement('td');
    tdBoat.textContent = boat || '(이름 없음)';
    const tdPort = document.createElement('td');
    tdPort.textContent = port || '';
    if (!port) tdPort.className = 'muted';

    const tdState = document.createElement('td');
    if (live.has(key)) tdState.innerHTML = '<span class="ok">현황판에 있음</span>';
    else {
      // 배 이름이 바뀌었거나 그 사이트가 계속 실패하면 현황판에서 ☆ 를 못 누릅니다.
      tdState.innerHTML = '<span class="muted">지금 목록에 없음</span>';
      tr.classList.add('off');
    }

    const tdDel = document.createElement('td');
    const btn = document.createElement('button');
    btn.className = 'small';
    btn.textContent = '지우기';
    btn.addEventListener('click', () => {
      const next = loadFavs().filter((k) => k !== key);
      if (!saveFavs(next)) return toast('브라우저가 저장을 막고 있습니다');
      renderFavs(trips);
      toast('지웠습니다');
    });
    tdDel.append(btn);

    tr.append(tdBoat, tdPort, tdState, tdDel);
    box.append(tr);
  }

  $('favclear').onclick = () => {
    if (!confirm(`즐겨찾기 ${loadFavs().length}개를 전부 지웁니다. 계속할까요?`)) return;
    if (!saveFavs([])) return toast('브라우저가 저장을 막고 있습니다');
    renderFavs(trips);
    toast('전부 지웠습니다');
  };
}

function staticMode(reason) {
  LOCAL = false;
  $('banner').hidden = false;
  $('banner').className = 'banner warn';
  $('banner').textContent =
    `읽기 전용입니다 (${reason}). 켜고 끄기·표기 수정·수집 재실행·종료는 로컬에서 run.bat으로 띄웠을 때만 됩니다.`;
  for (const id of ['save', 'update', 'collect', 'restart', 'quit']) $(id).disabled = true;
}

async function load() {
  // 즐겨찾기 대조에 출조 목록이 필요합니다. 읽기 전용 모드에서는 사이트 표도 여기서 만듭니다.
  const data = await fetch('data.json?t=' + Date.now())
    .then((r) => r.json())
    .catch(() => ({ sites: {}, trips: [] }));

  if (LOCAL) {
    const d = await api('api/sites').then((r) => r.json());
    SITES = d.sites;
    STATUS = d.status;
    RESTARTABLE = d.restartable;
    $('update').textContent = RESTARTABLE ? '최신 코드 받고 재시작' : '최신 코드 받기';
    $('update').title = RESTARTABLE
      ? 'git pull 후 서버를 다시 띄웁니다'
      : 'git pull만 합니다. run.bat으로 띄운 게 아니라 자동 재시작은 안 됩니다';
    $('restart').disabled = !RESTARTABLE;
    $('restart').title = RESTARTABLE
      ? '현재 코드를 그대로 다시 띄웁니다'
      : 'run.bat으로 띄운 게 아니라 자동 재실행은 안 됩니다';
    $('meta').textContent =
      `사이트 ${SITES.length}곳 (켜짐 ${SITES.filter((s) => s.enabled !== false).length}, ` +
      `수동 ${SITES.filter((s) => !s.addedBy).length} · 자동 ${SITES.filter((s) => s.addedBy).length}) · ` +
      `출조 ${d.trips}건 · 갱신 ${when(d.generatedAt) || '-'}`;
  } else {
    const d = data;
    STATUS = d.sites ?? {};
    // 정적 모드에서는 registry를 못 읽으므로 수집 결과에 남은 사이트만 보여줍니다.
    SITES = Object.entries(STATUS).map(([id, s]) => ({
      id, name: s.name, platformLabel: s.platform, url: s.url, port: s.port, phone: s.phone,
      addedBy: s.addedBy ?? null,
    }));
    $('meta').textContent =
      `사이트 ${SITES.length}곳 (수동 ${SITES.filter((s) => !s.addedBy).length} · ` +
      `자동 ${SITES.filter((s) => s.addedBy).length}) · ` +
      `출조 ${d.trips?.length ?? 0}건 · 갱신 ${when(d.generatedAt) || '-'}`;
  }
  render();
  renderFavs(data.trips ?? []);
}

(async () => {
  try {
    const res = await api('api/sites');
    if (res.ok) {
      LOCAL = true;
    } else if (res.status === 403) {
      staticMode('서버가 이 요청을 거절했습니다');
    } else {
      staticMode('관리 API가 없습니다');
    }
  } catch {
    staticMode('관리 API가 없습니다');
  }
  await load();
})();

bindPager();
$('save').addEventListener('click', save);
$('update').addEventListener('click', update);
$('collect').addEventListener('click', collect);
$('restart').addEventListener('click', restart);
$('quit').addEventListener('click', quit);
</script>
</body>
</html>
